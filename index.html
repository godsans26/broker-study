<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>손해보험중개사 · 문제연습</title>
<style>
*{box-sizing:border-box} :root{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#24332f;background:#f4f6f3;font-synthesis:weight;line-height:1.7;letter-spacing:-.015em}
body{margin:0} button{font:inherit;cursor:pointer} button:focus-visible{outline:3px solid #237fbd;outline-offset:4px} button:disabled{cursor:default} [hidden]{display:none!important}
.app{max-width:860px;margin:44px auto;padding:0 24px} header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;color:#65766e;margin:0 0 4px} h1{font-size:23px;letter-spacing:-.8px;margin:0;font-weight:750} .subtitle{font-size:13px;color:#68796f;margin:5px 0 0}
.quiet{border:1px solid #cdd7cf;border-radius:9px;background:transparent;color:#52675b;padding:8px 13px;white-space:nowrap;font-size:13px}
.progress-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:#647469;margin-bottom:9px} #position{color:#234b3b;font-weight:700} progress{display:block;width:100%;height:5px;border:0;border-radius:9px;overflow:hidden;appearance:none;background:#dce4dc;margin:0 0 22px} progress::-webkit-progress-bar{background:#dce4dc} progress::-webkit-progress-value{background:#386e54} progress::-moz-progress-bar{background:#386e54}
.card{background:#fff;border:1px solid #e0e6df;border-radius:18px;padding:30px 34px;box-shadow:0 8px 30px #24332f04} .question-meta{display:flex;align-items:center;gap:9px;margin-bottom:20px;font-size:12px;color:#718177} .badge{color:#385f49;background:#edf3ec;padding:4px 10px;border-radius:6px;font-weight:700}
h2{margin:0 0 22px;font-size:21px;line-height:1.8;letter-spacing:-.55px;word-break:keep-all;overflow-wrap:anywhere;font-weight:650} #conditions{white-space:pre-wrap;background:#f5f7f4;border:1px solid #dce4da;border-radius:9px;padding:16px 18px;margin:-4px 0 22px;font-size:15px;overflow-wrap:anywhere}
.options{display:grid;gap:10px}.option{display:flex;align-items:flex-start;gap:13px;width:100%;text-align:left;border:1px solid #dce3dd;border-radius:10px;padding:14px 16px;background:#fff;color:#34483a;font-size:16px;line-height:1.75;transition:background .15s,border-color .15s;word-break:keep-all;overflow-wrap:anywhere}.option:not(:disabled):hover{border-color:#61856b;background:#f6faf5}.number{flex-shrink:0;border:1px solid #cfd9d0;border-radius:50%;width:25px;height:25px;line-height:23px;text-align:center;font-size:13px;font-weight:600;margin-top:2px}.option.correct{background:#edf7ef;border-color:#5f9872;color:#215c37}.option.wrong{background:#fff2f1;border-color:#cf8179;color:#943d35}.option.correct .number{background:#36794d;border-color:#36794d;color:#fff}.option.wrong .number{background:#b35147;border-color:#b35147;color:#fff}.choice-text{flex:1}.choice-label{font-size:12px;font-weight:700;white-space:nowrap;margin-top:4px}
#feedback{margin-top:26px;border-top:1px solid #e4e9e2;padding-top:22px} #verdict{font-size:17px;font-weight:750;margin:0 0 5px} #feedback.good #verdict{color:#256640} #feedback.bad #verdict{color:#a24339} #answer-line{font-size:13px;color:#657569;margin:0 0 16px}.explanation-box{border-left:3px solid #739380;background:#f6f8f4;padding:15px 18px;border-radius:0 8px 8px 0}.explanation-title{font-size:12px;font-weight:700;color:#526b56;margin:0 0 7px} #explanation{font-size:15px;line-height:1.85;white-space:pre-line;margin:0;word-break:keep-all;overflow-wrap:anywhere} #source{font-size:11px;color:#758176;margin:12px 0 0}
nav{display:flex;justify-content:space-between;gap:16px;margin-top:26px;padding-top:22px;border-top:1px solid #edf0ea} nav button{border:1px solid #d7dfd5;border-radius:9px;padding:10px 19px;font-size:14px;font-weight:650;background:#fff;color:#415344} #next{background:#315b43;border-color:#315b43;color:#fff} nav button:disabled,#next:disabled{color:#9aa59b;background:#f1f4ef;border-color:#e4e9e1} .footer{margin:18px 0 36px;text-align:center;font-size:12px;color:#79867a} .notice{padding:12px 16px;border:1px solid #e3d6aa;background:#fff9e7;color:#786524;border-radius:9px;font-size:13px;margin:0 0 16px} #summary{background:#e7f1e6;border:1px solid #c9dec6;border-radius:10px;margin:0 0 18px;padding:16px 20px;color:#315b38;font-weight:650;font-size:15px}
@media(max-width:600px){.app{margin:24px auto;padding:0 16px}header{gap:10px;margin-bottom:24px}h1{font-size:19px}.subtitle{font-size:11px}.quiet{font-size:12px;padding:7px 10px}.card{padding:22px 19px;border-radius:14px}h2{font-size:18px;line-height:1.8}.option{font-size:15px;padding:12px;gap:10px}.choice-label{font-size:11px}.progress-row{font-size:12px}.explanation-box{padding:13px}.footer{font-size:11px}#explanation{font-size:14px}}
.study-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 20px}.flag{display:flex;align-items:center;gap:8px;font-size:14px;color:#715820;cursor:pointer}.flag input{width:18px;height:18px;accent-color:#8a6c25}.review-panel{margin-top:20px;background:#fff;border:1px solid #dce3dd;border-radius:14px;padding:22px}.review-heading{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.review-heading h2{font-size:18px;margin:0}.review-hint{color:#69776d;font-size:12px}.review-item{padding:15px 0;border-top:1px solid #e4e9e2}.review-item button{background:none;border:0;padding:0;text-align:left;color:#315b43;font-weight:700;font-size:14px}.review-item p{font-size:13px;margin:6px 0;overflow-wrap:anywhere}.review-status{color:#805a35}#review-list{max-height:480px;overflow:auto}
/* Comfortable reading sizes; installed fonts keep this file fully offline. */
h1{font-weight:700;letter-spacing:-.035em}h2{font-weight:700;letter-spacing:-.025em;line-height:1.75}#stem{color:#171717}.option{font-size:17px;line-height:1.8;font-weight:500;color:#202020}#explanation{font-size:16px;line-height:1.9;font-weight:500;color:#202020}#conditions{font-size:16px;line-height:1.85;font-weight:600;color:#202020}
@media(max-width:600px){.option,#explanation,#conditions{font-size:16px}h2{font-size:19px}}
</style>
</head>
<body>
<main class="app">
  <header><div><p class="eyebrow">STUDY / 손해보험중개사</p><h1>배상책임 · 특종 · 보증보험</h1><p class="subtitle">예상문제 1–10회 · 150문항 랜덤 연습</p></div><button class="quiet" id="restart">새로 시작</button></header>
  <div class="study-tools" aria-label="진행 기록 이동"><button class="quiet" id="export-progress">진행 기록 내보내기</button><button class="quiet" id="import-progress">진행 기록 불러오기</button><input type="file" id="import-file" accept=".json,application/json" hidden></div>
  <p id="transfer-status" class="review-hint" role="status" hidden></p>
  <p id="storage-warning" class="notice" role="status" hidden></p>
  <div class="progress-row"><span id="position"></span><span id="score"></span></div>
  <progress id="progress" max="150" value="0" aria-label="답변 완료 문항 수"></progress>
  <div id="summary" role="status" hidden></div>
  <article class="card" aria-labelledby="stem">
    <div class="question-meta"><span class="badge" id="round"></span><span id="original-number"></span></div>
    <div class="study-tools"><label class="flag"><input id="uncertain" type="checkbox">☆ 헷갈린 문제</label><button class="quiet" id="review-toggle" aria-expanded="false" aria-controls="review-panel">복습 로그</button></div>
    <h2 id="stem" tabindex="-1"></h2>
    <div id="conditions" hidden></div>
    <div id="options" class="options" role="group" aria-label="답안 선택"></div>
    <section id="feedback" aria-live="polite" aria-atomic="true" hidden>
      <p id="verdict"></p><p id="answer-line"></p>
      <div class="explanation-box"><p class="explanation-title" id="explanation-title">해설</p><p id="explanation"></p></div>
      <p id="source"></p>
    </section>
    <nav aria-label="문제 이동"><button id="previous">← 이전 문제</button><button id="next">다음 문제 →</button></nav>
  </article>
  <section id="review-panel" class="review-panel" hidden aria-labelledby="review-title">
    <div class="review-heading"><h2 id="review-title">복습 로그</h2><button class="quiet" id="export-log">로그 저장 (.txt)</button></div>
    <p class="review-hint">현재 풀이의 오답과 헷갈린 문제를 모았습니다. 번호를 누르면 해당 문제로 이동합니다. 새로 시작하기 전에 로그를 파일로 저장해 두세요.</p>
    <p id="review-count" class="review-hint" aria-live="polite"></p>
    <div id="review-list"></div>
  </section>
  <p class="footer" id="save-note">답을 고르면 바로 채점됩니다. 진행 상황은 이 브라우저에 자동 저장됩니다.</p>
  <noscript><p class="notice">문제를 풀려면 브라우저의 JavaScript를 켜 주세요.</p></noscript>
</main>
<script id="questions" type="application/json">[{"id":"1-16","round":1,"number":16,"stem":"국문 영업배상책임보험의 특별약관 중 제3자 배상책임과 보관자 배상책임을 함께 담보하는 것은?","conditions":"","options":["도급업자 특별약관","시설소유관리자 특별약관","임차자 특별약관","차량정비업자 특별약관"],"answer":3,"explanation":"차량정비업자 특약은 정비를 위해 맡은 고객 차량(보관자 배상책임)과 작업 중 제3자 손해를 함께 담보한다. 도급업자·시설소유관리자는 제3자만, 임차자는 보관자만 담보한다. 근거 28-19, 30-17","tag":"영업배상","questionPage":1,"explanationPage":2},{"id":"1-17","round":1,"number":17,"stem":"기계보험에 대한 설명으로 가장 옳지 않은 것은?","conditions":"","options":["보험가입금액은 신조달가액(New Replacement Cost)을 기준으로 정한다.","화재위험은 보상하지 않으므로 화재보험을 별도로 가입하여야 한다.","사업장 구내에서 시운전이 끝나 가동 가능한 상태인 기계를 대상으로 가입한다.","연료, 윤활유, 냉매 등 운전 보조재는 별도로 명기하지 않아도 기계에 포함된다."],"answer":3,"explanation":"연료·윤활유·냉매·촉매 같은 소모성 운전 보조재는 보험목적에서 제외되며, 별도로 명기하거나 특약으로 가입해야 한다. 24-25와 31-18에서 같은 지문이 정답으로 출제되었다. 근거 24-25, 31-18","tag":"기술","questionPage":1,"explanationPage":2},{"id":"1-18","round":1,"number":18,"stem":"배상청구기준(Claims-made Basis) 배상책임보험에 대한 설명으로 가장 옳지 않은 것은?","conditions":"","options":["보험기간 중에 피보험자에게 최초로 제기된 손해배상청구를 담보 기준으로 한다.","소급담보일자는 손해배상청구가 제기된 시점을 기준으로 정한다.","소급담보일자는 보험에서 담보하는 행위의 발생 시점을 한정한다.","원칙적으로 소급담보일자 이전에 발생한 행위로 인한 청구는 담보하지 않는다."],"answer":1,"explanation":"소급담보일자는 청구 시점이 아니라 원인이 된 행위(부당행위·과실)가 발생한 시점을 제한하는 날짜이다. 근거 31-17, 28-24","tag":"배상상품","questionPage":1,"explanationPage":2},{"id":"1-19","round":1,"number":19,"stem":"근로자재해보장책임보험의 사용자배상책임 특별약관에 대한 설명으로 옳은 것은?","conditions":"","options":["산재보험과 같이 사용자의 과실과 관계없이 보상하는 무과실책임 구조이다.","보험계약자는 사용자이고 피보험자는 근로자이다.","재해보상책임 특별약관 또는 산업재해보상보험법에 따른 급부가 이루어진 경우에 한하여 보상한다.","산재 급부 여부와 관계없이 사용자가 근로자에게 부담하는 손해배상금 전액을 보상한다."],"answer":2,"explanation":"사용자배상책임(EL)은 산재·재해보상 급부를 넘어서는 사용자의 법률상 배상책임을 담보하므로 급부가 전제된다. 과실책임이며, 계약자와 피보험자 모두 사용자이다. 근거 27-19, 28-23, 29-21","tag":"근재","questionPage":1,"explanationPage":2},{"id":"1-20","round":1,"number":20,"stem":"전자기기보험의 보통약관을 구성하는 조항이 아닌 것은?","conditions":"","options":["재물손해 조항","외적정보매체 조항","배상책임손해 조항","추가작업비용 조항"],"answer":2,"explanation":"전자기기보험 보통약관은 재물손해, 외적정보매체, 추가작업비용(대용기기 사용) 3개 조항으로 구성되며 배상책임 조항은 없다. 근거 28-22","tag":"기술","questionPage":1,"explanationPage":2},{"id":"1-21","round":1,"number":21,"stem":"다음 중 법률에 따라 의무적으로 가입하여야 하는 배상책임보험이 아닌 것은?","conditions":"","options":["가스사고배상책임보험","병원배상책임보험","승강기사고배상책임보험","재난배상책임보험"],"answer":1,"explanation":"병원(의사)배상책임보험은 임의보험이다. 가스사고·승강기사고·재난배상책임보험은 각 법률에 따른 의무보험이다. 근거 25-23, 26-18","tag":"의무·해상","questionPage":1,"explanationPage":2},{"id":"1-22","round":1,"number":22,"stem":"패키지보험 제1부문(재산종합위험담보)의 소규모공사조항 (Minor Works Clause)에 대한 설명으로 가장 옳은 것은?","conditions":"","options":["보험증권에 기재된 공사계약금액을 초과하는 건설공사에도 적용된다.","통상적인 운전과정에서 발생하는 변경, 유지, 수정 작업에도 적용된다.","소규모공사의 지연에 따른 예정이익상실도 보상한다.","소규모공사를 담보하는 다른 보험이 있으면 그 보험에서 담보하는 금액의 초과분만 담보한다."],"answer":3,"explanation":"다른 보험이 있으면 조항 적용이 배제되는 것이 아니라 초과분을 담보한다. 공사금액 초과 공사, 통상 운전 중 작업, 지연에 따른 예정이익상실은 대상이 아니다. 근거 31-16, 23-23","tag":"패키지","questionPage":1,"explanationPage":2},{"id":"1-23","round":1,"number":23,"stem":"국문 동산종합보험에 대한 설명으로 옳은 것은?","conditions":"","options":["기평가보험으로서 재조달가액을 기준으로 보상하며 감가상각은 적용하지 않는다.","공장 내에 장치된 기계 중 리스물건인 기계는 인수할 수 있다.","화재, 도난, 파손, 폭발 등 약관에 열거된 위험만 보상하는 열거위험 담보방식이다.","전기적 사고나 기계적 사고는 보통약관에서 담보한다."],"answer":1,"explanation":"공장 내 장치 기계는 원칙적으로 인수 제외이지만 리스물건은 예외로 인수한다. 동산종합은 포괄(전위험)담보 방식이며, 전기적·기계적 사고는 면책이다. 근거 28-21","tag":"기타특종","questionPage":1,"explanationPage":2},{"id":"1-24","round":1,"number":24,"stem":"독일식 조립보험의 시운전 위험에 대한 설명으로 가장 옳지 않은 것은?","conditions":"","options":["시운전기간은 통상 4주를 기본으로 담보한다.","조립 완성 후 조립 상태만 점검하는 Cold test는 조립공사의 일부로 본다.","보험의 목적이 중고품인 경우 시운전기간에 대한 보험자의 책임은 4주를 초과하지 않는 범위에서 담보한다.","시운전기간이 4주를 초과하는 경우 별도의 약정으로 시운전 위험을 담보할 수 있다."],"answer":2,"explanation":"보험의 목적이 중고품이면 시운전이 시작되는 즉시 보험자의 책임이 끝나므로 시운전 위험을 담보하지 않는다. 근거 27-22, 31-25","tag":"기술","questionPage":1,"explanationPage":2},{"id":"1-25","round":1,"number":25,"stem":"금융기관종합보험(Banker's Blanket Bond)에서 보상하지 않는 손해는?","conditions":"","options":["직원이 단독으로 또는 타인과 공모하여 행한 횡령으로 입은 손해","수표, 어음 등의 서명이 위조되거나 변조되어 입은 손해","현금 등 보험의 목적을 운송하는 중에 발생한 사고로 직원이나 운반인이 입은 상해손해","사업장 내 강도로 파손된 건물 및 집기비품의 손해"],"answer":2,"explanation":"BBB는 금융기관의 재산손실을 담보하는 보험이다. 운송 중 직원·운반인의 상해(신체손해)는 담보하지 않는다. 근거 28-25, 25-18","tag":"기타특종","questionPage":1,"explanationPage":2},{"id":"1-26","round":1,"number":26,"stem":"보증보험과 신용보험에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["신용보험도 채무자를 위하여 가입하는 타인을 위한 보험이다.","보증보험은 채무자가 보험계약자, 채권자가 피보험자가 된다.","신용보험은 채권자가 보험계약자 겸 피보험자가 된다.","보증보험은 타인을 위한 보험이다."],"answer":0,"explanation":"신용보험은 채권자가 스스로 계약자 겸 피보험자가 되는 자기를 위한 보험이다. '신용보험도 타인을 위한 보험'은 단골 오답이다. 근거 29-27, 30-28, 26-29","tag":"보증총론","questionPage":1,"explanationPage":2},{"id":"1-27","round":1,"number":27,"stem":"전세금보장신용보험에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["임대인이 임대차계약에서 정한 임차보증금 반환채무를 이행하지 않아 임차인이 입은 손해를 보상한다.","보험계약자는 주택을 임대하는 임대인이다.","주계약은 금전소비대차계약이 아니라 주택 임대차계약이다.","보험계약자의 신용도와 무관하게 보험요율이 적용된다."],"answer":1,"explanation":"전세금보장신용보험은 임차인이 계약자 겸 피보험자가 되는 신용보험이다. '계약자 = 임대인'은 27-28에서 오답으로 출제되었다. 근거 27-28, 28-30, 23-28, 28-28","tag":"보증상품","questionPage":2,"explanationPage":2},{"id":"1-28","round":1,"number":28,"stem":"신원보증보험에 대한 설명으로 옳은 것은?","conditions":"","options":["피보증인이 직무상의 지위를 이용하여 보험기간 중 피보험자에게 입힌 재산상의 직접손해를 보상한다.","고용주의 불성실 행위로 피용인이 입은 손해를 보상한다.","피보증인이 위조화폐를 수령하여 생긴 손해도 보통약관에서 보상한다.","보험계약자는 고용주로 한정된다."],"answer":0,"explanation":"신원보증보험은 피용인(피보증인)의 절도·강도·사기·횡령·배임 등 불성실 행위로 고용주가 입은 손해를 보상한다. 계약자는 피보증인 또는 사용자가 될 수 있다. 근거 30-30, 29-28, 31-29, 28-29","tag":"보증상품","questionPage":2,"explanationPage":2},{"id":"1-29","round":1,"number":29,"stem":"이행(계약)보증보험에서 주계약에 계약보증금 몰수·귀속 조항이 없어 보험가입금액 한도 내 실손해를 보상하는 경우, 아래 조건에서 보상액은?","conditions":"공사계약금액 50억 원 (보험가입금액 5억 원)\n기성(타절)금액 40억 원 · 잔여공사금액 10억 원\n잔여공사를 이행하기 위해 다른 업체와 계약한 금액 13억 원","options":["3억 원","5억 원","10억 원","13억 원"],"answer":0,"explanation":"실손해는 잔여공사를 마치기 위해 새로 계약한 금액에서 원래 잔여공사 금액을 뺀 13억 − 10억 = 3억 원이며, 보험가입금액 5억 원 이내이므로 3억 원을 보상한다. 근거 24-29","tag":"보증상품","questionPage":2,"explanationPage":3},{"id":"1-30","round":1,"number":30,"stem":"공탁보증보험에 대한 설명으로 옳은 것은?","conditions":"","options":["피보험자는 가압류 등 민사사건의 신청인이다.","피보험자는 손해배상청구권에 관한 집행권원이 없어도 보험금을 청구할 수 있다.","계약상의 채무불이행을 담보하는 상품이다.","보험계약자는 법원에 담보를 제공하여야 하는 자이다."],"answer":3,"explanation":"공탁보증은 법령상 담보제공 의무를 담보한다. 계약자는 담보제공 의무자(가압류 신청인 등), 피보험자는 확정된 집행권원을 받은 권리자이다. 근거 23-27, 28-30, 28-26","tag":"보증상품","questionPage":2,"explanationPage":3},{"id":"2-16","round":2,"number":16,"stem":"임원배상책임보험(D&O)에서 보상하는 손해가 아닌 것은?","conditions":"","options":["소송에서 확정된 손해배상금","소송 전 화해(합의)에 따른 합의금","법정 대응에 필요한 변호사비용과 소송비용","형사소송에 따른 벌금이나 과태료"],"answer":3,"explanation":"벌금·과태료는 형사·행정 제재로서 보험으로 전가할 수 없어 보상하지 않는다. 근거 29-24","tag":"배상상품","questionPage":3,"explanationPage":3},{"id":"2-17","round":2,"number":17,"stem":"패키지보험 제3부문(기업휴지위험담보)에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["제1부문(PAR) 또는 제2부문(MB)에서 담보하는 사고로 물적손해가 발생하여야 한다.","제1부문 및 제2부문과 관련 없는 사고로 인한 기업휴지도 상실이익을 보상한다.","물적손해로 인한 조업 중단·감소로 생산이 감소하여야 한다.","매출액 감소로 인한 총이익의 상실액과 특별비용을 보상한다."],"answer":1,"explanation":"BI는 제1·2부문에서 담보하는 사고로 물적손해가 생긴 것을 전제로 한다. 관련 없는 사고로 인한 휴지는 보상하지 않는다. 근거 25-17, 27-16","tag":"패키지","questionPage":3,"explanationPage":3},{"id":"2-18","round":2,"number":18,"stem":"국문 영업배상책임보험 시설소유관리자 특별약관에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["의무적으로 가입해야 하는 보험이 있으면 그 보험의 보상액을 초과하는 손해만 보상한다.","시설에 기인한 사고뿐 아니라 시설의 용도에 따른 업무 수행 중의 사고도 보상한다.","티끌, 먼지, 석면, 분진 또는 소음으로 생긴 손해는 보상하지 않는다.","물적손해확장 추가특별약관을 가입하면 피보험자 소유의 시설 자체의 손해도 보상한다."],"answer":3,"explanation":"물적손해확장 추가특약은 보관·관리 재물 등으로 담보를 넓히는 것이며, 피보험자 소유 시설 자체의 손해는 배상책임보험의 대상이 아니다. 근거 26-20, 31-19","tag":"영업배상","questionPage":3,"explanationPage":3},{"id":"2-19","round":2,"number":19,"stem":"운영 중인 도로, 교량, 터널, 부두 등 토목구조물의 위험을 담보하는 완성토목공사물보험의 피보험자로 가장 적합한 자는?","conditions":"","options":["완성토목공사물의 소유·관리자","완성토목공사물의 시공 건설업자","완성토목공사물의 설계자","완성토목공사물의 자재 제조 및 공급업자"],"answer":0,"explanation":"완성토목공사물보험(CCAR)은 공사가 끝나 운영 중인 구조물의 재물손해를 담보하므로 소유·관리자가 피보험자이다. 근거 30-22, 31-20","tag":"기술","questionPage":3,"explanationPage":3},{"id":"2-20","round":2,"number":20,"stem":"가스사고배상책임보험의 보상한도에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["대인 사망은 피해자 1인당 8,000만 원 한도이며, 손해액이 2,000만 원 미만이면 2,000만 원을 지급한다.","부상자가 치료 중 그 부상이 원인이 되어 사망하면 사망 한도액과 부상 한도액을 더한 금액을 한도로 한다.","대인 부상은 피해자 1인당 최고 2,000만 원 한도이다.","부상자에게 그 부상이 원인이 되어 후유장해가 생기면 부상 한도액과 후유장해 한도액을 더한 금액을 한도로 한다."],"answer":2,"explanation":"가스사고배상책임보험의 부상 한도는 1급 1,500만 원(14급 20만 원)까지이다. 근거 29-17","tag":"의무·해상","questionPage":3,"explanationPage":3},{"id":"2-21","round":2,"number":21,"stem":"선원근로자재해보장책임보험에서 육상근로자와 비교하여 선원에게만 적용되는 보상은?","conditions":"","options":["행방불명보상, 소지품유실보상","요양보상, 장해보상","유족보상, 장제비","휴업보상, 장해보상"],"answer":0,"explanation":"행방불명보상과 소지품유실보상은 선원법상 재해보상에만 있는 항목이다. 근거 30-18","tag":"근재","questionPage":3,"explanationPage":3},{"id":"2-22","round":2,"number":22,"stem":"다음 중 컨틴전시보험(Contingency Insurance)으로 분류되지 않는 것은?","conditions":"","options":["날씨보험","상금보상보험","행사취소보험","기업휴지보험"],"answer":3,"explanation":"컨틴전시보험은 날씨·행사취소·상금보상처럼 특정 우연한 사건에 따른 재정적 손실을 담보한다. 기업휴지보험은 재산손해에 따른 이익상실 보험이다. 근거 23-18","tag":"기타특종","questionPage":3,"explanationPage":3},{"id":"2-23","round":2,"number":23,"stem":"패키지보험의 확장담보조항 중 제2부문(기계위험담보)의 확장담보조항이 아닌 것은?","conditions":"","options":["건축사, 조사자, 자문기술자 용역비용 담보조항","소방비용 담보조항","특별비용(Expediting Cost) 담보조항","일시적 철거위험 담보조항"],"answer":1,"explanation":"소방비용 담보조항은 제1부문(PAR)에만 있는 확장담보이다. 건축사 등 비용, 특별비용, 일시적 철거는 제2부문(MB)에도 있다. 근거 31-22, 26-24","tag":"패키지","questionPage":3,"explanationPage":3},{"id":"2-24","round":2,"number":24,"stem":"전자기기보험에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["가동 중이거나 가동 가능한 상태로 설치되어 있는 전자기기를 가입대상으로 한다.","선택에 따라 외적정보매체에 입은 손해를 보상받을 수 있다.","망실 또는 분실로 인한 손해는 보상하지 않는다.","화재, 폭발, 전기적·기계적 사고는 보상하지만 홍수, 범람 등 자연재해 손해는 보상하지 않는다."],"answer":3,"explanation":"전자기기보험은 전위험담보 방식이라 홍수·범람 등 자연재해 손해도 보상한다. 근거 24-18, 27-25","tag":"기술","questionPage":3,"explanationPage":3},{"id":"2-25","round":2,"number":25,"stem":"골프보험에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["골프 중 사고로 제3자에게 법률상 배상책임을 부담하여 입은 손해는 특별약관으로만 담보한다.","회사의 책임은 보험기간 첫날 오후 4시에 시작하여 마지막 날 오후 4시에 끝난다.","골프용품의 손해는 시가를 기준으로 보험가입금액을 한도로 보상한다.","골프장 경영자가 자신이 경영하는 골프장에서 한 홀인원은 홀인원비용 특별약관에서 보상하지 않는다."],"answer":0,"explanation":"골프보험의 배상책임손해는 기본 담보이다. '특별약관으로 담보한다'는 30-25에서 오답으로 출제되었다. 근거 30-25","tag":"기타특종","questionPage":3,"explanationPage":3},{"id":"2-26","round":2,"number":26,"stem":"민법상 보증채무의 법적 성질에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["보증채무는 주채무가 반드시 존재하여야 하지만 주채무에 종속되지는 않는다.","보증채무는 채권자와 보증인 사이의 보증계약으로 성립하므로 주채무와는 별개의 채무이다.","보증채무의 내용은 원칙적으로 주채무의 내용과 동일하다.","보증인은 최고·검색의 항변권을 가진다."],"answer":0,"explanation":"보증채무는 주채무에 종속된다(부종성). 주채무가 없거나 소멸하면 보증채무도 성립하지 않거나 소멸한다. 근거 27-30, 23-30","tag":"보증총론","questionPage":3,"explanationPage":3},{"id":"2-27","round":2,"number":27,"stem":"보증보험의 특수성에 대한 설명으로 가장 거리가 먼 것은?","conditions":"","options":["보증보험계약의 당사자는 보험계약자, 피보험자, 보증보험회사이다.","보증보험의 보험사고는 불법행위 또는 채무·의무 불이행으로 발생한다.","경기변동에 둔감하여 경기 영향을 비교적 적게 받는다.","성질에 반하지 않는 범위에서 민법의 보증채무 규정을 준용한다."],"answer":2,"explanation":"보증보험은 채무자의 이행능력에 좌우되므로 경기변동에 민감하다. 근거 30-27","tag":"보증총론","questionPage":4,"explanationPage":3},{"id":"2-28","round":2,"number":28,"stem":"보험계약자와 피보험자가 주계약을 체결하고 이행하는 과정에서 이행보증보험 증권이 통상적으로 발급되는 순서로 옳은 것은?","conditions":"","options":["입찰 → 선금급 → 계약 → 하자","입찰 → 계약 → 선금급 → 하자","계약 → 선금급 → 하자 → 입찰","계약 → 입찰 → 하자 → 선금급"],"answer":1,"explanation":"입찰 단계의 입찰보증, 낙찰 후 계약보증, 선금 지급 시 선금급보증, 준공 후 하자보증 순으로 발급된다. 근거 25-27","tag":"보증상품","questionPage":4,"explanationPage":3},{"id":"2-29","round":2,"number":29,"stem":"프랜차이즈보증보험과 가맹사업보증보험에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["프랜차이즈보증보험은 가맹본부의 예치가맹금 반환의무를 담보한다.","프랜차이즈보증보험의 보험계약자는 가맹본부이다.","가맹사업보증보험의 보험계약자는 가맹본부이다.","프랜차이즈보증보험의 피보험자는 가맹사업자(가맹희망자)이다."],"answer":2,"explanation":"가맹사업보증보험은 가맹사업자의 채무를 담보하므로 계약자는 가맹사업자, 피보험자는 가맹본부이다. 근거 27-27, 23-29","tag":"보증상품","questionPage":4,"explanationPage":4},{"id":"2-30","round":2,"number":30,"stem":"법령상의 의무 이행을 담보하는 보증보험(채무이행보증)이 아닌 것은?","conditions":"","options":["인허가보증보험","납세보증보험","생활안정자금보증보험","공탁보증보험"],"answer":2,"explanation":"생활안정자금보증보험은 회사에서 대출받은 직원의 상환채무(계약상 채무)를 담보한다. 근거 27-26","tag":"보증상품","questionPage":4,"explanationPage":4},{"id":"3-16","round":3,"number":16,"stem":"「해운법」을 적용받는 해상여객운송사업자가 여객의 피해에 대비하여 가입하는 보험은?","conditions":"","options":["유도선사업자배상책임보험","선주배상책임보험","수상레저보험","마리나업자배상책임보험"],"answer":1,"explanation":"해운법상 여객운송사업자는 선주배상책임보험에 가입한다. 유도선사업자배상책임보험은 유선·도선사업자가 가입한다. 근거 28-16","tag":"의무·해상","questionPage":5,"explanationPage":4},{"id":"3-17","round":3,"number":17,"stem":"건설공사보험에서 보험의 목적이 아닌 것은?","conditions":"","options":["공사목적물","설계도면 및 서류","공사용 가설물","공사용 기계·장비"],"answer":1,"explanation":"설계도면·서류·장부·유가증권 등은 건설공사보험의 보험목적에서 제외된다. 공사용 기계는 특약으로 담보한다. 근거 28-20","tag":"기술","questionPage":5,"explanationPage":4},{"id":"3-18","round":3,"number":18,"stem":"국문 영업배상책임보험의 특별약관에서 보상한도액을 대인·대물 단일보상한도액(CSL)으로 정하기에 적합하지 않은 것은?","conditions":"","options":["임차자 특별약관","주차장 특별약관","시설소유관리자 특별약관","경비업자 특별약관"],"answer":0,"explanation":"임차자 특약은 임차한 시설에 대한 보관자 배상책임(대물)만 담보하므로 대인·대물 단일한도를 설정할 이유가 없다. 근거 27-21","tag":"영업배상","questionPage":5,"explanationPage":4},{"id":"3-19","round":3,"number":19,"stem":"생산물배상책임보험에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["피보험자가 제조·판매한 생산물의 결함으로 타인의 신체나 재물에 입힌 손해를 보상한다.","사고의 방지 또는 경감을 위하여 지급한 손해방지비용도 보상한다.","제조자가 아닌 판매업자도 가입할 수 있다.","결함 있는 생산물의 회수, 검사, 대체 비용도 보상한다."],"answer":3,"explanation":"생산물 자체의 손해와 회수·검사·대체 비용(리콜 비용)은 생산물배상책임보험에서 보상하지 않는다. 근거 25-16, 29-19","tag":"배상상품","questionPage":5,"explanationPage":4},{"id":"3-20","round":3,"number":20,"stem":"기계보험에서 보상하는 손해는?","conditions":"","options":["보일러 연관 내 가스폭발로 인한 물적손해","지면 침하로 인한 물적손해","태풍, 폭풍우로 인한 물적손해","벼락으로 인한 간접손해"],"answer":0,"explanation":"기계 내부의 폭발(보일러 연관 내 가스폭발)은 기계보험의 담보 사고이다. 지면 침하·풍수해 등 외부 자연재해는 보상하지 않는다. 근거 29-18","tag":"기술","questionPage":5,"explanationPage":4},{"id":"3-21","round":3,"number":21,"stem":"산업재해보상보험과 근로자재해보장책임보험에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["두 보험 모두 사용자에게 과실이 있어야 보상하는 과실책임주의를 따른다.","산재보험은 산업재해보상보험법에 근거한 의무보험이다.","근재보험의 사용자배상책임은 민법상 손해배상책임을 담보한다.","피해자는 중복 청구할 수 없고 산재급여를 초과하는 손해를 근재보험으로 청구한다."],"answer":0,"explanation":"산재보험(재해보상)은 무과실책임이다. 과실책임은 근재보험의 사용자배상책임 부분에만 적용된다. 근거 29-21, 25-21","tag":"근재","questionPage":5,"explanationPage":4},{"id":"3-22","round":3,"number":22,"stem":"국문 도난보험에 대한 설명으로 옳은 것은?","conditions":"","options":["담보 기준은 손해발견기준 증권이다.","현금 및 유가증권 담보 특별약관에 가입하면 보관시설 내뿐 아니라 운송 중 위험도 담보한다.","손해를 보상하면 남은 보험기간에 대한 보험가입금액은 자동으로 복원된다.","보통약관은 일반사항만 정하고, 담보위험은 보험의 목적별로 특별약관을 첨부한다."],"answer":3,"explanation":"국문 도난보험은 보통약관에 일반사항만 두고, 담보위험은 목적물별 특별약관으로 정한다. 근거 26-21","tag":"기타특종","questionPage":5,"explanationPage":4},{"id":"3-23","round":3,"number":23,"stem":"패키지보험 배상책임 담보부문(General Liability)의 확장담보조항인 교차배상책임(Cross Liability)이 담보하는 것은?","conditions":"","options":["원도급자와 하도급자 간의 계약상 책임","피보험자가 제3자에게 입힌 배상책임","피보험자 상호간의 배상책임","보험계약자와 보험회사 간의 책임"],"answer":2,"explanation":"교차배상책임은 증권에 기재된 여러 피보험자를 서로 제3자로 보아 피보험자 상호간의 배상책임을 담보한다. 근거 30-19","tag":"패키지","questionPage":5,"explanationPage":4},{"id":"3-24","round":3,"number":24,"stem":"기술보험 등에 적용하는 72시간 조항(72 Hours Clause)에 대한 설명으로 옳은 것은?","conditions":"","options":["보험기간이 개시되고 72시간이 지난 때부터 발생한 손해를 보상한다.","보험기간이 끝난 후 72시간까지 발생한 손해도 보상한다.","건물을 72시간 이상 비워 둔 동안 발생한 손해는 보상하지 않는다.","지진, 홍수 등 자연재해로 72시간 동안 발생한 손해를 1사고로 본다."],"answer":3,"explanation":"72시간 조항은 자연재해 등으로 72시간 안에 생긴 손해를 하나의 사고로 묶어 자기부담금과 한도를 적용하게 하는 조항이다. 근거 27-23","tag":"기술","questionPage":5,"explanationPage":4},{"id":"3-25","round":3,"number":25,"stem":"유아교육기관종합보험에서 담보하지 않는 위험은?","conditions":"","options":["건물 및 집기비품의 화재손해","유아 및 교직원의 상해","화재로 인한 기업휴지손해","시설 또는 운영의 결함으로 인한 배상책임"],"answer":2,"explanation":"유아교육기관종합보험은 재물(화재), 상해, 배상책임을 묶은 상품으로 기업휴지는 담보하지 않는다. 근거 23-25","tag":"기타특종","questionPage":5,"explanationPage":4},{"id":"3-26","round":3,"number":26,"stem":"다음은 보증보험 상품의 법률적 근거인 「보험업법」 제2조의 손해보험상품 정의이다. 〈 〉에 들어갈 내용으로 옳은 것은?","conditions":"손해보험상품: 위험보장을 목적으로 우연한 사건으로 발생하는 손해(〈 〉 또는 〈 〉으로 발생하는 손해를 포함한다)에 관하여 금전 및 그 밖의 급여를 지급할 것을 약속하고 대가를 수수하는 계약","options":["보증보험 – 신용보험","법률행위 – 행정행위","민법상 계약불이행 – 형법상 불법행위","계약상 채무불이행 – 법령상 의무불이행"],"answer":3,"explanation":"손해보험상품의 손해에는 '계약상 채무불이행 또는 법령상 의무불이행으로 발생하는 손해'가 포함되며, 이것이 보증보험의 근거이다. 근거 24-28","tag":"보증총론","questionPage":5,"explanationPage":4},{"id":"3-27","round":3,"number":27,"stem":"납세보증보험에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["보험금은 보험계약자가 납부할 세액으로 하며 가산금, 중가산금, 체납처분비는 포함하지 않는다.","보험계약자는 조세 관련 법령에서 규정하는 납세담보 제공 의무자이다.","피보험자는 국가 또는 지방자치단체의 장이다.","보험기간은 납세담보가 필요한 기간으로 하되, 국세기본법 및 지방세법에 따른 계약은 그 기간에 30일을 더한다."],"answer":0,"explanation":"납세보증보험의 보험금에는 세액뿐 아니라 가산금·중가산금·체납처분비도 포함된다. 근거 31-26, 28-30","tag":"보증상품","questionPage":6,"explanationPage":4},{"id":"3-28","round":3,"number":28,"stem":"임차인의 임차보증금 반환채권을 담보하는 보험상품이 아닌 것은?","conditions":"","options":["전세금보장신용보험","권리금보호신용보험","임대주택보증보험","상가보증금보장신용보험"],"answer":1,"explanation":"권리금보호신용보험은 임대인의 권리금 회수기회 방해로 인한 손해를 보상하며, 임차보증금 반환과는 관계가 없다. 근거 27-29","tag":"보증상품","questionPage":6,"explanationPage":4},{"id":"3-29","round":3,"number":29,"stem":"상가 임차인이 임차기간이 끝난 뒤 상가를 원상회복하여 반환하지 않아 임대인이 입은 손해를 보상받기에 가장 적합한 보험상품은?","conditions":"","options":["계약보증보험","하자보증보험","지급보증보험","전세금보장신용보험"],"answer":2,"explanation":"원상회복 비용 지급 등 계약상 지급채무의 불이행을 담보하는 것은 이행(지급)보증보험이다. 근거 28-27","tag":"보증상품","questionPage":6,"explanationPage":4},{"id":"3-30","round":3,"number":30,"stem":"상업신용보험에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["보험계약자는 채권자이다.","타인을 위한 보험이다.","피보험자는 채권자이다.","보험회사와 채권자의 협의로 보상비율을 정하여 피보험자가 손해를 분담할 수 있다."],"answer":1,"explanation":"상업신용보험은 채권자가 계약자 겸 피보험자인 자기를 위한 보험이다. 근거 26-29, 24-30","tag":"보증상품","questionPage":6,"explanationPage":5},{"id":"4-16","round":4,"number":16,"stem":"국문 영업배상책임보험에서 제3자 배상책임과 보관자 배상책임을 동시에 담보하지 않는 특별약관은?","conditions":"","options":["주차장 특별약관","도급업자 특별약관","항만하역업자(싸이로) 특별약관","차량정비업자 특별약관"],"answer":1,"explanation":"도급업자 특약은 공사 중 제3자 배상책임만 담보한다. 주차장·항만하역업자·차량정비업자 특약은 맡은 재물(보관자)과 제3자를 함께 담보한다. 근거 30-17, 28-19","tag":"영업배상","questionPage":7,"explanationPage":5},{"id":"4-17","round":4,"number":17,"stem":"다음 중 배상책임위험을 담보하지 않는 보험상품은?","conditions":"","options":["유아교육기관종합보험","골프보험","패키지보험","동산종합보험"],"answer":3,"explanation":"동산종합보험은 동산의 재물손해만 담보한다. 나머지 상품에는 배상책임 담보가 들어 있다. 근거 27-20","tag":"기타특종","questionPage":7,"explanationPage":5},{"id":"4-18","round":4,"number":18,"stem":"조립보험에 대한 설명으로 가장 옳지 않은 것은?","conditions":"","options":["시운전기간은 통상 4주를 기본으로 담보하며, Hot test는 조립 완성 후 조립 상태만 점검하는 것으로 조립공사의 일부로 본다.","보험기간은 기간보험과 구간보험이 혼용된 혼합보험기간이다.","보험계약자의 선택에 따라 제3자 배상책임, 주위재산, 공사용 기계, 잔존물제거비용을 담보받을 수 있다.","우연한 사고로 인한 손해를 포괄적으로 담보하는 전위험담보(All Risks Cover) 보험이다."],"answer":0,"explanation":"조립 상태만 점검하여 조립공사의 일부로 보는 것은 Cold test이다. Hot test는 실제 가동 시험인 시운전에 해당한다. 근거 31-25","tag":"기술","questionPage":7,"explanationPage":5},{"id":"4-19","round":4,"number":19,"stem":"적재물배상책임보험에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["화물자동차운송위험 담보조항은 증권에 기재된 화물자동차로 운송하는 동안 수탁화물에 대한 법률상 배상책임을 보상한다.","살아있는 동물은 화물자동차운송위험 담보조항의 수탁화물에 포함되지 않는다.","운송기간에는 발송지 상차와 도착지 하차작업이 포함되며, 반입·반출·환적과 기계를 이용한 상하차도 포함된다.","운송주선위험 담보조항에서 피보험자가 소유·관리하는 창고에 보관 중 발생한 손해는 보상하지 않는다."],"answer":2,"explanation":"운송기간에 상차·하차작업은 포함되지만 반입, 반출, 환적과 기계를 이용한 상하차는 포함되지 않는다. 근거 23-22","tag":"의무·해상","questionPage":7,"explanationPage":5},{"id":"4-20","round":4,"number":20,"stem":"국문 영업배상책임보험에서 보상하는 손해의 범위에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["피보험자가 피해자에게 지급할 법률상 손해배상금을 보상한다.","피보험자가 회사의 동의 없이 임의로 지급한 소송비용과 변호사 비용도 보상한다.","피보험자가 손해의 방지 또는 경감을 위하여 지출한 필요하거나 유익한 비용을 보상한다.","보상한도액 내에서 피보험자가 부담한 공탁보증보험료를 보상한다."],"answer":1,"explanation":"소송비용·변호사비용은 회사의 동의를 얻어 지출한 경우에 보상하며, 임의로 지급한 비용은 보상하지 않는다. 근거 29-23","tag":"영업배상","questionPage":7,"explanationPage":5},{"id":"4-21","round":4,"number":21,"stem":"기업중대사고 배상책임보험에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["징벌적 손해배상책임은 특별약관으로 담보하며 손해액의 3배를 넘지 않는 범위에서 보상한다.","상시근로자 5인 이상인 사업 또는 사업장이 적용 대상이다.","중대재해는 중대산업재해와 중대시민재해로 구분된다.","형사방어비용 특별약관은 혐의가 없거나 무죄로 종결된 경우 변호사비용과 소송비용을 보상한다."],"answer":0,"explanation":"중대재해처벌법상 징벌적 손해배상은 손해액의 5배 이내이다. 근거 30-23, 28-18","tag":"배상상품","questionPage":7,"explanationPage":5},{"id":"4-22","round":4,"number":22,"stem":"근로자재해보장책임보험 사용자배상책임 특별약관에서 보상한도액을 설정하는 방법으로 옳은 것은?","conditions":"","options":["1인당 보상한도액과 1사고당 보상한도액을 각각 설정한다.","1인당 보상한도액만 설정한다.","1사고당 대인·대물 일괄 단일보상한도액을 설정한다.","1사고당 대인 보상한도액과 대물 보상한도액을 각각 설정한다."],"answer":0,"explanation":"사용자배상책임은 근로자의 신체 재해만 담보하므로 대물 한도가 없고, 1인당과 1사고당 한도를 각각 둔다. 근거 31-21","tag":"근재","questionPage":7,"explanationPage":5},{"id":"4-23","round":4,"number":23,"stem":"패키지보험 제2부문(기계위험담보)의 확장담보조항인 특별비용 담보조항(Expediting Costs)에서 보상하는 비용이 아닌 것은?","conditions":"","options":["시간외 수당","휴일 수당","해상운임","야근 수당"],"answer":2,"explanation":"특별비용은 긴급 수리를 위한 시간외·야근·휴일 수당과 급행운임을 보상한다. 해상운임은 대상이 아니다. 근거 30-20","tag":"패키지","questionPage":7,"explanationPage":5},{"id":"4-24","round":4,"number":24,"stem":"기술보험에서 제작자결함에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["제작자결함이란 설계, 주조, 재질, 제작상의 결함을 말한다.","기계보험 약관은 제작자결함으로 인한 손해를 보통약관에서 담보한다.","독일식 건설공사보험 약관은 설계결함을 제외한 제작자결함으로 인한 손해를 보통약관에서 담보한다.","독일식 조립보험 약관은 제작자결함으로 인한 손해를 보통약관에서 담보한다."],"answer":3,"explanation":"기출(30-21)은 독일식 조립보험 보통약관이 제작자결함 손해를 담보하지 않는 것으로 처리하였다. 기계보험은 보통약관에서 담보한다. 근거 30-21, 25-19","tag":"기술","questionPage":7,"explanationPage":5},{"id":"4-25","round":4,"number":25,"stem":"국문 동산종합보험에서 협정보험가액 특별약관을 첨부하여 가입할 수 있는 것은?","conditions":"","options":["통화, 유가증권, 인지, 우표 등","글, 그림, 골동품, 조각물 등","자동차(이륜차 포함)","점당 100만 원 이상인 귀금속·귀중품"],"answer":1,"explanation":"객관적 시가 산정이 어려운 글·그림·골동품·조각물은 미리 가액을 협정하는 특별약관으로 가입한다. 근거 30-24","tag":"기타특종","questionPage":7,"explanationPage":5},{"id":"4-26","round":4,"number":26,"stem":"보증보험의 보험종목 및 상품에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["보증보험 사업방법서는 보증보험의 종류를 신원보증, 채무이행보증, 선급금이행보증, 신용, 기타로 분류한다.","보증보험과 신용보험은 모두 타인을 위한 보험이다.","신용보험에는 상업신용, 재무신용, 기타 상품이 있다.","보증보험은 계약자(채무자)와 피보험자(채권자)가 다르지만, 신용보험은 계약자와 피보험자가 모두 채권자로 같다."],"answer":1,"explanation":"신용보험은 채권자가 계약자 겸 피보험자이므로 자기를 위한 보험이다. 근거 30-28","tag":"보증총론","questionPage":7,"explanationPage":5},{"id":"4-27","round":4,"number":27,"stem":"보험계약자(채무자)의 신용등급에 따른 요율 차등을 적용하지 않는 상품은?","conditions":"","options":["이행(계약)보증보험","오토론 보증","보석보증보험","인·허가보증보험"],"answer":2,"explanation":"보석보증보험은 계약자의 신용등급에 따른 요율 차등을 두지 않는다. 같은 유형으로 전세금보장신용보험도 신용도와 무관한 요율이 적용된다. 근거 26-28, 28-28","tag":"보증총론","questionPage":8,"explanationPage":5},{"id":"4-28","round":4,"number":28,"stem":"신원보증보험의 특별약관에 해당하지 않는 것은?","conditions":"","options":["청구보증 특별약관","추가위험부담 특별약관","대위권제한 특별약관","손·망실손해배상 특별약관"],"answer":0,"explanation":"신원보증보험 특약에는 추가위험부담, 대위권제한, 손·망실손해배상 특약이 있으며 청구보증 특약은 없다. 근거 25-29","tag":"보증상품","questionPage":8,"explanationPage":5},{"id":"4-29","round":4,"number":29,"stem":"인·허가보증보험에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["보험계약자는 인가, 허가, 면허 등 행위의 출원자로서 보험계약을 청약하는 자이다.","피보험자는 인·허가 관청의 장으로 하되, 관계법령에 다른 규정이 있으면 그에 따른다.","보험가입금액은 보험계약자가 인·허가자(피보험자)에게 예치하여야 할 금액이다.","보험기간은 인·허가기간으로 하며 다르게 정할 수 없다."],"answer":3,"explanation":"인·허가보증보험의 보험기간은 인·허가기간을 원칙으로 하지만 '다르게 정할 수 없다'는 26-26에서 오답으로 출제되었다. 근거 26-26","tag":"보증상품","questionPage":8,"explanationPage":5},{"id":"4-30","round":4,"number":30,"stem":"다음 보증보험 상품 중 주계약이 금전소비대차계약(대출계약)이 아닌 것은?","conditions":"","options":["소액대출보증보험","개인주택자금보증보험","전세금보장신용보험","생활안정자금보증보험"],"answer":2,"explanation":"전세금보장신용보험의 주계약은 주택 임대차계약이다. 나머지는 대출금 상환채무를 담보한다. 근거 23-28","tag":"보증상품","questionPage":8,"explanationPage":6},{"id":"5-16","round":5,"number":16,"stem":"배상청구기준 증권에서 보고연장기간(Extended Reporting Period)이 적용되는 전제 조건이 아닌 것은?","conditions":"","options":["보험기간 중 보험사고가 발생하여 보험금이 지급된 경우","보험료 미납 이외의 사유로 보험계약이 해지되거나 갱신되지 않은 경우","갱신된 배상청구기준 증권의 소급담보일자가 이전 증권의 소급담보일자보다 뒤로 정해진 경우","갱신된 증권이 손해사고기준 증권인 경우"],"answer":0,"explanation":"보고연장기간은 계약 종료나 담보 공백(소급일 후퇴, 손해사고기준으로 변경)으로 청구를 받을 기회가 사라질 때 부여된다. 보험금 지급 여부는 전제가 아니다. 근거 25-24","tag":"배상상품","questionPage":9,"explanationPage":6},{"id":"5-17","round":5,"number":17,"stem":"건설공사보험의 책임기간에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["공사 현장에 보험목적의 하역이 끝나지 않았다면 스케줄상 보험기간이 시작되었더라도 보험자의 책임은 개시되지 않는다.","통상 도급계약서상의 공사기간과 같은 기간을 보험기간으로 정한다.","공사목적물의 일부가 발주자에게 인도되어 사용되더라도 보험기간이 끝날 때까지 그 부분에 대한 담보책임이 유지된다.","조립보험과 달리 시운전 담보가 없으므로 필요하면 시운전담보 특별약관으로 담보한다."],"answer":2,"explanation":"공사목적물이 인도되거나 사용되기 시작한 부분은 그때 보험자의 책임이 끝난다. 근거 26-19","tag":"기술","questionPage":9,"explanationPage":6},{"id":"5-18","round":5,"number":18,"stem":"패키지보험(Package Insurance Policy)에 대한 설명으로 옳은 것은?","conditions":"","options":["기업휴지담보의 보험가입금액은 약정복구기간에 상응하는 기간의 총이익으로 정한다.","재조달가액 기준으로 가입하면 전부손해 여부나 복구 여부와 관계없이 재조달가액으로 보상한다.","예정이익상실(ALOP)은 제3부문에서 담보한다.","제4부문은 피보험자가 소유한 재물의 직접손해를 담보한다."],"answer":0,"explanation":"BI 가입금액은 약정복구기간의 총이익이다. 재조달가액 보상도 실제 복구를 전제로 하며, ALOP는 패키지에서 담보하지 않고, 제4부문은 배상책임(GL)이다. 근거 25-20, 28-17","tag":"패키지","questionPage":9,"explanationPage":6},{"id":"5-19","round":5,"number":19,"stem":"해외근로자재해보장책임보험에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["크게 재해보상책임 특별약관(WC)과 사용자배상책임 특별약관 (EL)의 두 가지 보상형태로 나뉜다.","재해보상확장 추가특별약관과 사용자배상책임 특별약관이 결합하여 산업재해보상보험법 수준으로 보상된다.","비업무상재해 확장 추가특별약관을 가입하면 비업무상 상해·질병도 업무상 재해와 같은 방법으로 보상한다.","피보험자의 사업이 산재보험에 가입되면 그때부터 해외근재보험 계약은 효력을 잃는다."],"answer":1,"explanation":"산재보험법 수준의 보상은 재해보상책임 특약(WC)과 재해보상확장 추가특약의 결합으로 이루어진다. 사용자배상책임은 그 초과 배상책임을 담보한다. 근거 24-22","tag":"근재","questionPage":9,"explanationPage":6},{"id":"5-20","round":5,"number":20,"stem":"2025년 11월 28일부터 시행된 전기자동차 충전시설 사고배상책임보험에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["충전시설 관리자에게 고의 또는 과실이 없으면 보험금을 지급하지 않는 과실책임보험이다.","「전기안전관리법」에 따라 전기자동차 충전시설 관리자가 의무적으로 가입하여야 한다.","충전시설의 화재, 폭발 등으로 인한 대인·대물 손해를 보상한다.","보상한도는 대인 1인당 1억 5천만 원, 대물 사고당 10억 원이다."],"answer":0,"explanation":"충전시설 사고배상책임보험은 관리자에게 고의·과실이 없어도 피해자에게 보험금을 지급하는 무과실책임보험이다. 근거 신규(2025.11.28 시행)","tag":"의무·해상","questionPage":9,"explanationPage":6},{"id":"5-21","round":5,"number":21,"stem":"전자기기보험의 보상에 대한 설명으로 가장 옳지 않은 것은?","conditions":"","options":["다양한 원인의 사고로 인한 기기 자체의 물적손해와, 선택에 따라 정보매체의 손실·복구 비용이나 대용기기 사용비용까지 보상한다.","기계적·전기적 사고를 포함하여 설계, 제작, 설치결함, 재질결함 등의 원인에 의한 물적손해를 보상한다.","보험기간 중 발생한 종업원 또는 제3자의 악의에 의한 손해도 보상한다.","사용자의 고의나 도난에 의한 손해는 어떤 경우에도 보상하지 않는다."],"answer":3,"explanation":"전자기기보험은 도난 손해도 보상할 수 있다(망실·분실은 면책). '어떤 경우에도 보상하지 않는다'는 31-24에서 오답으로 출제되었다. 근거 31-24, 27-25","tag":"기술","questionPage":9,"explanationPage":6},{"id":"5-22","round":5,"number":22,"stem":"금융기관종합보험(BBB)에서 직원의 범죄행위에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["직원의 절도, 사기, 횡령 등이 담보위험이다.","직원이 단독으로 행하였든 타인과 공모하였든 모두 포함한다.","피보험자에게 손해를 입히거나 직원 자신이 금전적 이득을 얻으려는 명백한 의사가 있어야 한다.","직원의 업무상 과실이나 중과실로 입은 손해도 담보한다."],"answer":3,"explanation":"BBB의 직원 부정행위 담보는 명백한 가해·이득 의사가 있는 범죄행위를 대상으로 하며, 단순 과실·중과실은 담보하지 않는다. 근거 24-23","tag":"기타특종","questionPage":9,"explanationPage":6},{"id":"5-23","round":5,"number":23,"stem":"패키지보험 제1부문(재산종합위험담보)의 면책위험(Special Exclusions)에 해당하지 않는 것은?","conditions":"","options":["누출, 오염 및 오탁과 관련된 파괴나 손해 및 비용","자동살수장치의 누출로 인한 손해","기계장치, 전기·전자기기 등의 조작 실패, 고장, 운전불량","결함 있는 부분, 자재, 설계의 대체·수리·교정 비용"],"answer":1,"explanation":"자동살수장치(스프링클러) 누출 손해는 제1부문에서 담보한다. 기계적 고장은 제2부문(MB)의 영역이라 제1부문에서 면책한다. 근거 29-25","tag":"패키지","questionPage":9,"explanationPage":6},{"id":"5-24","round":5,"number":24,"stem":"국문 영업배상책임보험 도급업자 특별약관에서 보상하지 않는 손해 중 추가특별약관을 첨부하면 담보할 수 있는 손해는?","conditions":"","options":["공사 중 발생한 소음으로 현장 주변에 생긴 민원","공사 중 발생한 진동으로 옆 건물에 입힌 손해","피보험자가 보호, 관리, 통제하는 재물에 발생한 손해","공사물건 자체에 입힌 손해"],"answer":1,"explanation":"진동·지반 약화로 인한 인접 재산 손해는 추가특약으로 담보할 수 있다. 근거 24-21","tag":"영업배상","questionPage":9,"explanationPage":6},{"id":"5-25","round":5,"number":25,"stem":"반려동물보험에 대한 설명으로 가장 옳지 않은 것은?","conditions":"","options":["무자격 수의사에게 치료받은 비용은 보상하지 않는다.","통상 책임개시를 위한 대기기간과 자기부담금이 있다.","보험기간 중 갱신되더라도 가입 시 보험료가 변동 없이 유지되는 것이 일반적이다.","보험기간 중 반려동물을 타인에게 양도하면 보험회사에 알려야 한다."],"answer":2,"explanation":"반려동물보험은 갱신(재가입) 시 반려동물의 나이·건강상태·청구이력에 따라 보험료가 바뀔 수 있다. 근거 31-23","tag":"기타특종","questionPage":9,"explanationPage":6},{"id":"5-26","round":5,"number":26,"stem":"보증보험에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["보증보험 표준약관은 채무이행보증보험, 신용보험, 신원보증보험 3가지가 있다.","성질에 반하지 않는 범위에서 보증채무에 관한 민법 규정이 준용된다.","계약상 채무불이행 또는 법령상 의무불이행으로 입은 손해를 보상한다.","보험업법상 제3보험업에 해당한다."],"answer":3,"explanation":"보증보험은 보험업법상 손해보험업에 속한다. 근거 29-30, 24-28","tag":"보증총론","questionPage":10,"explanationPage":6},{"id":"5-27","round":5,"number":27,"stem":"주택 및 부동산 관련 보증(신용)보험 상품에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["전세금대출신용보험은 전세자금 대출을 받은 채무자가 상환의무를 이행하지 않아 채권자가 입은 손해를 보상한다.","전세임대주택신용보험은 임대인이 임차보증금 반환채무를 이행하지 않아 임차인이 입은 손해를 보상한다.","전세금보장신용보험은 임차인이 임차보증금 납부의무를 이행하지 않아 임대인이 입은 손해를 보상한다.","상가보증금보장신용보험은 상가 임대인이 임차보증금 반환채무를 이행하지 않아 임차인이 입은 손해를 보상한다."],"answer":2,"explanation":"전세금보장신용보험은 임대인이 보증금 반환채무를 이행하지 않아 임차인이 입은 손해를 보상한다. 설명의 방향이 거꾸로 되어 있다. 근거 30-29","tag":"보증상품","questionPage":10,"explanationPage":6},{"id":"5-28","round":5,"number":28,"stem":"권리금보호신용보험에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["임대인이 권리금 회수기회 방해행위를 하여 임차인이 입은 재산상 손해를 보상한다.","「유통산업발전법」상 대규모점포와 준대규모점포의 임대차계약도 가입대상이다.","보험계약자 겸 피보험자는 임차인이다.","보험료 분할납입 특별약관을 적용할 수 있다."],"answer":1,"explanation":"대규모점포·준대규모점포는 상가임대차법상 권리금 회수기회 보호 대상이 아니므로 가입대상에서 제외된다. 근거 25-26","tag":"보증상품","questionPage":10,"explanationPage":6},{"id":"5-29","round":5,"number":29,"stem":"이행(계약)보증보험에서 보상하는 손해에 해당하는 것은?","conditions":"","options":["전쟁, 내란, 폭동 등으로 채무를 이행하지 못한 경우","핵연료물질의 방사성 등으로 인한 사고로 채무를 이행하지 못한 경우","지진, 홍수 등 천재지변으로 채무를 이행하지 못한 경우","피보험자의 책임 없는 사유로 보험계약자가 계약상 의무를 이행하지 않아 계약보증금 몰수·귀속 사유가 생긴 경우"],"answer":3,"explanation":"계약보증은 계약자의 귀책으로 인한 의무 불이행을 담보한다. 전쟁·핵·천재지변 같은 불가항력은 면책이다. 근거 29-26, 31-27","tag":"보증상품","questionPage":10,"explanationPage":6},{"id":"5-30","round":5,"number":30,"stem":"국제 보증거래에서 발주자가 국가적·법률적 위험을 피하려고 자국 내 보증인의 보증서를 요구하는 경우, 수급인(보증신청인)의 요청으로 그 보증인을 위하여 발급하는 보증서는?","conditions":"","options":["Performance Bond","Advance Payment Bond","Counter Guarantee Bond","Maintenance Bond"],"answer":2,"explanation":"발주국 은행(보증인)이 보증서를 내도록 국내 보증기관이 그 보증인에게 발급하는 역보증이 Counter Guarantee(구상보증)이다. 근거 25-30","tag":"보증상품","questionPage":10,"explanationPage":7},{"id":"6-16","round":6,"number":16,"stem":"전문인배상책임보험(Professional Indemnity Insurance)에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["손해사고기준(Occurrence Basis) 보험증권이 일반적이다.","입증책임은 원칙적으로 피해자가 지지만 전문직업의 특성상 전환될 수 있다.","전문업무 수행 중 과실로 제3자에게 손해를 끼쳐 부담하는 법률상 배상책임을 보상한다.","의사, 변호사, 회계사, 보험중개사 등이 전문인의 예이다."],"answer":0,"explanation":"전문인배상책임보험은 사고와 청구 사이의 시차가 길어 배상청구기준(Claims-made) 증권이 일반적이다. 근거 24-17","tag":"배상상품","questionPage":11,"explanationPage":7},{"id":"6-17","round":6,"number":17,"stem":"완성토목공사물보험에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["교량, 도로, 터널, 댐뿐 아니라 골프장, 스키장 등 토목구조물도 목적물로 한다.","화재, 낙뢰, 폭발, 충돌 등을 보상한다.","특별약관으로 기계위험담보를 추가할 수 있다.","지진, 화산활동, 해일, 눈사태 등 자연재해는 보상하지 않는다."],"answer":3,"explanation":"완성토목공사물보험은 운영 중 구조물의 자연재해 위험(지진·해일·홍수 등)을 주로 담보한다. 근거 27-24","tag":"기술","questionPage":11,"explanationPage":7},{"id":"6-18","round":6,"number":18,"stem":"근로자재해보장책임보험(근재보험)과 산재보험의 관계에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["계약 체결 시 산재보험 의무가입 사업을 대상으로 가입한 재해보상책임 특별약관은 무효이다.","피보험자의 사업이 산재보험에 가입되면 그때부터 재해보상책임 특별약관은 효력을 잃는다.","사용자배상책임 특별약관은 재해보상책임 특별약관 또는 산재보험법에 따른 급부가 이루어진 경우에 한하여 보상한다.","사용자배상책임 특별약관은 산재보험과 마찬가지로 무과실책임주의가 적용된다."],"answer":3,"explanation":"사용자배상책임은 민법상 손해배상책임을 담보하므로 사용자의 과실이 있어야 하는 과실책임이다. 근거 26-23, 25-21","tag":"근재","questionPage":11,"explanationPage":7},{"id":"6-19","round":6,"number":19,"stem":"국문 임원배상책임보험에 대한 설명으로 옳은 것은?","conditions":"","options":["피보험자는 법인의 모든 임원으로, 보험기간 중 새로 선임된 임원은 포함하나 퇴임한 임원은 포함하지 않는다.","주주대표소송은 보통약관에서 담보한다.","하나의 사고에 대한 다수의 손해배상청구는 그중 최초로 제기된 날을 손해배상 청구일자로 본다.","피보험자가 사적 이득을 취하거나 범죄행위로 인한 배상청구도 피해자 보호를 위해 담보한다."],"answer":2,"explanation":"다수 청구는 최초 청구일에 모두 제기된 것으로 본다. 퇴임 임원도 피보험자이고, 주주대표소송은 특약 담보이며, 사적 이득·범죄는 면책이다. 근거 26-16","tag":"배상상품","questionPage":11,"explanationPage":7},{"id":"6-20","round":6,"number":20,"stem":"기계보험의 이익상실담보 특별약관에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["특별약관에 기재된 사업장 내 보상사고로 피보험자의 영업이 중단·휴지되어 생긴 손해를 보상한다.","손해를 입은 기계가 재가동 상태로 복구된 후 임차계약, 주문 등의 효력이 상실되어 생긴 영업손실은 보상하지 않는다.","기계설비에 생긴 물적손해의 결과로 정상운전에 필요한 원료, 완제품 등에 생긴 변질손해를 보상한다.","수리·대체에 필요한 자금을 적기에 조달하지 못하여 생긴 손해는 보상하지 않는다."],"answer":2,"explanation":"이익상실 특약은 영업 중단에 따른 이익 손실을 보상하며, 원료·제품의 변질손해는 보상하지 않는다. 근거 23-20","tag":"기술","questionPage":11,"explanationPage":7},{"id":"6-21","round":6,"number":21,"stem":"액화석유가스 관련 가스사고배상책임보험의 피보험자가 될 수 없는 자는?","conditions":"","options":["액화석유가스 판매업자","액화석유가스 소비자","가스시설 시공자","액화석유가스 위탁운송사업자"],"answer":1,"explanation":"가스사고배상책임보험은 가스사업자·시공자·운송사업자 등이 가입하는 의무보험이다. 소비자는 피해자 측이므로 피보험자가 아니다. 근거 26-25","tag":"의무·해상","questionPage":11,"explanationPage":7},{"id":"6-22","round":6,"number":22,"stem":"건설공사보험의 독일식 약관(Munich Re CAR)과 영국식 약관 (British CAR)에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["영국식 약관은 화재로 인한 손해에 자기부담금을 적용하여 보상한다.","영국식 약관은 공사금액이 증가한 경우 보험기간이 끝난 후 보험료를 정산하도록 정한다.","독일식 약관은 잔존물제거비용에 대해 보험가입금액을 별도로 정하여 가입한다.","독일식 약관에서 설계결함으로 인한 손해는 특약으로 가입한다."],"answer":0,"explanation":"기출(24-24)은 '영국식 약관이 화재 손해에 자기부담금을 적용한다'를 틀린 지문으로 처리하였다. 근거 24-24","tag":"기술","questionPage":11,"explanationPage":7},{"id":"6-23","round":6,"number":23,"stem":"패키지보험 보통약관 제1부문(PAR)과 제2부문(MB)에 모두 적용할 수 있는 확장담보조항은?","conditions":"","options":["소규모공사 조항","추가재산 담보조항","소방비용 담보조항","건축사, 조사자, 자문기술자 용역비용 담보조항"],"answer":3,"explanation":"건축사·조사자·자문기술자 용역비용 조항은 재산·기계 손해 복구에 모두 필요하므로 두 부문에 공통 적용된다. 소규모공사·추가재산·소방비용은 제1부문 조항이다. 근거 26-24, 31-22","tag":"패키지","questionPage":11,"explanationPage":7},{"id":"6-24","round":6,"number":24,"stem":"국문 영업배상책임보험의 보험료 환급에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["계약이 무효, 효력상실 또는 해지되는 경우 보험료를 환급한다.","계약자 또는 피보험자의 책임 없는 사유로 무효가 되면 납입한 보험료 전액을 환급한다.","계약자, 피보험자 또는 그 대리인의 고의나 중대한 과실로 무효가 되면 경과기간에 대해 단기요율로 계산한 보험료를 뺀 잔액을 환급한다.","계약자 또는 피보험자의 책임 없는 사유로 효력상실·해지되면 미경과기간에 대해 일단위로 계산한 보험료를 환급한다."],"answer":2,"explanation":"계약자 측의 고의·중과실로 계약이 무효가 된 때에는 보험료를 환급하지 않는다. 근거 23-16","tag":"영업배상","questionPage":11,"explanationPage":7},{"id":"6-25","round":6,"number":25,"stem":"금융기관종합보험(Banker's Blanket Bond)에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["종업원의 부정행위가 주된 담보위험이다.","사업장 내 재물손해뿐 아니라 운송 중의 재물손해도 담보한다.","강도, 강탈, 도난, 절도 등으로 발생한 집기비품, 설비, 장치 손해도 담보한다.","서명의 위조나 변조로 인한 손해는 담보하지 않는다."],"answer":3,"explanation":"BBB는 수표·어음 등의 서명 위조·변조로 인한 손해도 담보한다. 근거 25-18, 29-22","tag":"기타특종","questionPage":11,"explanationPage":7},{"id":"6-26","round":6,"number":26,"stem":"보증보험에 대한 설명으로 가장 옳지 않은 것은?","conditions":"","options":["보증채무는 주채무의 이행을 담보하므로 주채무가 반드시 있어야 한다.","보험가입금액과 보험가액의 비율에 따라 비례보상하는 것을 원칙으로 한다.","일반 손해보험과 달리 보험계약자가 임의로 보험계약을 해지할 수 없다.","상법상 보험자대위권과 민법상 구상권을 행사할 수 있다."],"answer":1,"explanation":"보증보험에는 보험가액 개념이 없어 비례보상을 하지 않고, 보험가입금액 한도 내 실손해를 보상한다. 근거 23-30","tag":"보증총론","questionPage":12,"explanationPage":7},{"id":"6-27","round":6,"number":27,"stem":"신원보증보험의 담보위험으로 가장 옳지 않은 것은?","conditions":"","options":["피보증인의 위조화폐 수령으로 인한 손해","피보증인의 고의로 인한 손해","피보증인의 횡령으로 인한 손해","피보증인의 배임행위로 인한 손해"],"answer":0,"explanation":"신원보증보험은 피보증인의 고의적 불성실 행위(절도·강도·사기·횡령·배임)를 담보한다. 위조화폐를 모르고 받은 손해는 담보위험이 아니다. 근거 31-29","tag":"보증상품","questionPage":12,"explanationPage":7},{"id":"6-28","round":6,"number":28,"stem":"이행(하자)보증보험에 대한 설명으로 옳은 것은?","conditions":"","options":["보험계약자는 발주자이다.","하자보수 또는 보완 청구를 받고도 이행하지 않아 생긴 손해를 보상한다.","피보험자는 하자보수 의무가 있는 수급인이다.","이행보증보험 증권 중 가장 먼저 발급된다."],"answer":1,"explanation":"하자보증은 하자보수 의무자(수급인)가 계약자, 하자보증금을 받을 발주자가 피보험자이며, 준공 후 마지막에 발급된다. 근거 25-27, 교재 p.174","tag":"보증상품","questionPage":12,"explanationPage":7},{"id":"6-29","round":6,"number":29,"stem":"법령에서 정한 채무 또는 의무 이행을 담보하는 보증보험 상품이 아닌 것은?","conditions":"","options":["가맹사업자보증보험","가맹본부보증보험(프랜차이즈보증보험)","인·허가보증보험","공탁보증보험"],"answer":0,"explanation":"가맹사업자보증보험은 가맹계약상 가맹사업자의 상품대금 등 채무를 담보한다. 가맹본부의 예치가맹금 반환은 가맹사업법상 의무이다. 근거 28-26","tag":"보증상품","questionPage":12,"explanationPage":7},{"id":"6-30","round":6,"number":30,"stem":"다음 중 신용보험 상품과 관련이 없는 제도는?","conditions":"","options":["손실분담 및 부분보상제도","총보상한도액제도","잔존보험가입금액제도","보험료 소급제도"],"answer":2,"explanation":"신용보험은 손실분담·부분보상, 총보상한도액, 보험료 소급 같은 제도를 운영한다. 잔존보험가입금액제도는 관련이 없다. 근거 24-30","tag":"보증상품","questionPage":12,"explanationPage":8},{"id":"7-16","round":7,"number":16,"stem":"선주배상책임보험 보통약관에서 보상하는 손해가 아닌 것은?","conditions":"","options":["선박에 탑승한 여객에게 입힌 손해에 대한 법률상 손해배상금","여객 외의 제3자에게 입힌 손해에 대한 법률상 손해배상금","제3자로부터 손해배상을 받을 권리를 지키거나 행사하기 위하여 지출한 비용","피보험자가 지급한 소송비용 및 변호사비용"],"answer":1,"explanation":"선주배상책임보험 보통약관은 여객에 대한 배상책임을 담보하며, 여객 외 제3자 손해는 보통약관의 보상 대상이 아니다. 근거 30-16","tag":"의무·해상","questionPage":13,"explanationPage":8},{"id":"7-17","round":7,"number":17,"stem":"다음 중 패키지보험(Package Insurance Policy)에서 담보하지 않는 위험은?","conditions":"","options":["재산종합(Property All Risks)","기업휴지(Business Interruption)","예정이익상실(Advanced Loss of Profit)","배상책임(General Liability)"],"answer":2,"explanation":"패키지보험은 재산종합·기계·기업휴지·배상책임 4개 부문이다. 예정이익상실(ALOP)은 건설·조립보험의 특약 영역이다. 근거 28-17","tag":"패키지","questionPage":13,"explanationPage":8},{"id":"7-18","round":7,"number":18,"stem":"건설공사보험과 조립보험에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["토목·건축공사 비중이 크면 건설공사보험, 기계·강구조물 설치 비중이 크면 조립보험으로 가입한다.","건설공사보험에서 잔존물제거비용은 별도 가입 없이 보험가입금액의 10% 한도로 자동 보상한다.","건설공사보험의 주위재산담보는 별도 특약과 함께 가입금액을 따로 설정해야 한다.","조립보험의 보통약관에서 제작자결함으로 생긴 손해는 직접·간접을 묻지 않고 보상하지 않는다."],"answer":1,"explanation":"건설공사보험의 잔존물제거비용은 특약으로 별도 가입금액을 정해 담보하며, 자동 보상되지 않는다. 근거 25-19","tag":"기술","questionPage":13,"explanationPage":8},{"id":"7-19","round":7,"number":19,"stem":"법률에 따라 의무보험 가입대상인 사업장이 국문 영업배상책임보험만 가입한 경우에 대한 설명으로 가장 옳은 것은?","conditions":"","options":["영업배상책임보험 계약은 무효가 된다.","의무보험에서 보상하는 금액을 초과하는 손해만 보상한다.","영업배상책임보험 계약은 효력을 상실한다.","손해액 전액을 보상한다."],"answer":1,"explanation":"의무보험이 있어야 하는 경우 영업배상책임보험은 의무보험 보상액을 초과하는 부분만 보상한다(초과보상). 근거 31-19, 26-20","tag":"영업배상","questionPage":13,"explanationPage":8},{"id":"7-20","round":7,"number":20,"stem":"해외 현장 근로자가 휴일에 업무와 무관한 개인 활동 중 감염병에 걸려 사망하였다. 사용자의 법률상 손해배상책임이 성립하지 않는다고 할 때, 해외근로자재해보장책임보험의 비업무상재해 확장 추가특별약관에서 보상 가능한 손해는?","conditions":"","options":["유족보상, 장사비","유족보상, 위자료","일실수입, 위자료","일실수입, 장사비"],"answer":0,"explanation":"비업무상재해 확장 특약은 업무상 재해와 같은 방법으로 재해보상(유족보상·장사비)을 지급한다. 위자료·일실수입은 사용자의 배상책임이 성립해야 하는 항목이다. 근거 26-22","tag":"근재","questionPage":13,"explanationPage":8},{"id":"7-21","round":7,"number":21,"stem":"국문 동산종합보험의 보험료 추징 및 환급에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["보험기간 중 기존 만기일을 만기로 하여 보험가입금액을 늘리거나 특약을 추가하는 경우 추가보험료는 일할계산한다.","위험이 증가·감소하거나 보험의 목적을 위험이 다른 장소로 옮기는 경우 미경과기간에 대해 일할계산한다.","보험계약자의 청구로 계약을 해지하는 경우 경과기간에 단기요율을 적용한 보험료를 공제한 잔액을 환급한다.","법령에 따른 보험의 목적의 철거, 양도, 이전으로 계약을 해지하는 경우 미경과기간에 대해 단기요율을 적용한다."],"answer":3,"explanation":"법령에 따른 철거·양도·이전처럼 계약자의 의사와 무관한 해지는 미경과기간에 대해 일할로 환급한다. 근거 29-16","tag":"기타특종","questionPage":13,"explanationPage":8},{"id":"7-22","round":7,"number":22,"stem":"국문 의사 및 병원배상책임보험에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["의료행위의 결과 환자에게 나쁜 결과가 발생하고, 그것이 객관적으로 예견하고 회피할 수 있는 사고여야 한다.","의사나 병원은 채무불이행책임과 불법행위책임을 동시에 부담한다.","공인되지 않은 특수 의료행위로 생긴 손해는 보상하지 않는다.","피보험자의 지시에 따르지 않은 의료기사의 행위로 생긴 손해도 불법행위 요건을 갖추면 담보한다."],"answer":3,"explanation":"피보험자의 지시·감독 범위를 벗어난 의료기사의 행위로 생긴 손해는 담보하지 않는다. 근거 25-22","tag":"배상상품","questionPage":13,"explanationPage":8},{"id":"7-23","round":7,"number":23,"stem":"기계보험의 보험목적에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["조립 후 시운전 중인 기계도 보통약관의 보험목적에 포함된다.","사업장 구내에 설치된 기계여야 한다.","시운전이 성공적으로 끝나 가동 가능한 상태여야 한다.","예비부품은 보험증권에 명시한 경우 보험목적이 된다."],"answer":0,"explanation":"시운전이 끝나지 않은 기계는 조립보험의 영역이다. 기계보험은 시운전을 마친 가동 가능한 기계를 대상으로 한다. 근거 24-25, 교재 p.165","tag":"기술","questionPage":13,"explanationPage":8},{"id":"7-24","round":7,"number":24,"stem":"패키지보험 제3부문(기업휴지위험담보)에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["제1부문(PAR) 또는 제2부문(MB)에서 담보하는 사고로 물적손해가 발생해야 한다.","매출액 감소로 인한 총이익의 상실액과 특별비용을 보상한다.","사고 당시 쌓여 있던 완제품 재고로 매출액 감소가 늦어진 경우 보상기간은 매출액 감소가 시작된 날부터 계산한다.","물적피해로 인한 조업 중단·감소로 생산 감소가 있어야 한다."],"answer":2,"explanation":"보상기간은 매출이 줄기 시작한 날이 아니라 물적손해가 발생한 날부터 계산한다. 재고로 매출 감소가 늦어진 기간도 보상기간에 포함된다. 근거 27-16","tag":"패키지","questionPage":13,"explanationPage":8},{"id":"7-25","round":7,"number":25,"stem":"2025년 5월 개편된 반려동물보험(펫보험) 상품구조에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["재가입 주기는 1년이다.","반려동물이 나이 들어도 보험료가 오르지 않도록 최대 20년간 재가입 심사 없이 보장한다.","보장비율은 최대 70%로 제한된다.","자기부담금은 최소 3만 원이다."],"answer":1,"explanation":"2025년 5월 개편으로 기존 최대 20년 만기·3~5년 갱신형에서 1년마다 재가입 심사를 받는 구조로 바뀌었다. 근거 신규(2025.5 개편), 31-23","tag":"기타특종","questionPage":13,"explanationPage":8},{"id":"7-26","round":7,"number":26,"stem":"채권자가 보증인에게 채무 이행을 청구했을 때, 보증인이 주채무자에게 변제자력이 있고 집행이 쉽다는 것을 증명하여 먼저 주채무자에게 청구하라고 요구할 수 있는 권리는?","conditions":"","options":["최고의 항변권","분별의 이익","검색의 항변권","청구회피권"],"answer":0,"explanation":"'먼저 주채무자에게 청구하라'는 항변이 최고의 항변권이다(민법 제437조). 주채무자의 재산에 먼저 집행하라는 것이 검색의 항변권이다. 근거 24-26","tag":"보증총론","questionPage":14,"explanationPage":8},{"id":"7-27","round":7,"number":27,"stem":"보험기간과 관계없이 보험가입금액에 따라 보험료를 부과하는 보증보험 상품은?","conditions":"","options":["이행(지급)보증보험","이행(계약)보증보험","이행(입찰)보증보험","이행(하자)보증보험"],"answer":2,"explanation":"입찰보증보험은 입찰 단계의 일회성 보증이라 기간이 아닌 보험가입금액을 기준으로 보험료를 부과한다. 근거 31-30","tag":"보증총론","questionPage":14,"explanationPage":8},{"id":"7-28","round":7,"number":28,"stem":"보증보험 상품에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["인·허가보증보험은 수허가자가 인·허가 조건을 이행하지 않아 허가관청 또는 제3자가 입은 손해를 보상한다.","물품대금보증보험은 구매자가 대금지급채무를 이행하지 않아 판매자가 입은 손해를 보상한다.","전세금보장신용보험은 임대인이 임차보증금 반환채무를 이행하지 않아 임차인이 돌려받아야 할 보증금을 보장한다.","신원보증보험은 고용주가 불성실 행위를 하여 피용인이 입은 손해를 보상한다."],"answer":3,"explanation":"신원보증보험은 피용인의 불성실 행위로 고용주가 입은 손해를 보상한다. 당사자가 거꾸로 되어 있다. 근거 29-28","tag":"보증상품","questionPage":14,"explanationPage":8},{"id":"7-29","round":7,"number":29,"stem":"이행(계약)보증보험에 대한 설명으로 가장 옳지 않은 것은?","conditions":"","options":["보험계약자에게 책임 있는 사유가 있으면 보상하지 않는다.","보험계약자는 계약보증금 납부 의무자이다.","피보험자는 계약보증금을 받으려는 자이다.","보험금 청구 시 지급금액은 주계약에서 정한 바에 따라 피보험자가 몰수 또는 귀속시켜야 할 금액이다."],"answer":0,"explanation":"계약보증은 계약자의 귀책으로 계약을 이행하지 않은 경우를 담보하는 상품이다. 근거 31-27, 29-26","tag":"보증상품","questionPage":14,"explanationPage":8},{"id":"7-30","round":7,"number":30,"stem":"온라인 플랫폼 미정산 사태 이후 관심이 커진 상품으로, 전자결제 수단 발행자가 상환채무를 이행하지 않을 때 결제수단 구매자가 입은 손해를 보상하는 보증보험 상품은?","conditions":"","options":["인·허가보증보험","카드가맹점보증보험","쇼핑몰보증보험","전자상거래(결제수단)보증보험"],"answer":3,"explanation":"선불충전금·상품권 등 전자결제수단의 상환채무 불이행을 담보하는 것은 전자상거래(결제수단)보증보험이다. 근거 30-26","tag":"보증상품","questionPage":14,"explanationPage":9},{"id":"8-16","round":8,"number":16,"stem":"국문 영업배상책임보험 시설소유관리자 특별약관에서 '보상하지 않는 손해'가 아닌 것은?","conditions":"","options":["피보험자가 소유·사용·관리하는 시설과 그 용도에 따른 업무 수행으로 생긴 우연한 사고로 타인의 신체·재물에 입힌 손해","피보험자의 근로자가 피보험자의 업무에 종사하던 중 입은 신체 장해","피보험자와 타인 간 손해배상 약정으로 가중된 배상책임","피보험자가 소유·사용·관리하는 자동차, 항공기, 선박으로 생긴 손해"],"answer":0,"explanation":"시설과 그 용도에 따른 업무 수행 중 사고는 시설소유관리자 특약이 보상하는 손해 자체이다. 근로자 재해, 약정 가중책임, 자동차·항공기·선박 손해는 면책이다. 근거 27-17","tag":"영업배상","questionPage":15,"explanationPage":9},{"id":"8-17","round":8,"number":17,"stem":"독일식 건설공사보험(Munich Re CAR) 보통약관 물적손해 담보 조항의 특별면책사항이 아닌 것은?","conditions":"","options":["위약금 및 공사지연 손해","재고조사를 할 때 발견된 손해","가설공사용 자재 손해","설계결함으로 인한 손해"],"answer":2,"explanation":"가설공사용 자재는 보험목적에 포함된다. 위약금·지연손해, 재고조사 시 발견 손해, 설계결함 손해는 특별면책이다. 근거 23-17","tag":"기술","questionPage":15,"explanationPage":9},{"id":"8-18","round":8,"number":18,"stem":"임원배상책임보험에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["보험기간 중 제기된 손해배상청구만 담보하는 배상청구기준 증권이다.","임원의 불법적인 사적 이익 취득이나 범죄행위로 인한 배상청구는 보상하지 않는다.","손해배상청구의 원인 행위는 증권에 표기된 소급담보일자 이후에 일어나야 담보된다.","임원배상책임담보조항(D&O Liability Coverage)은 임원의 부당행위로 회사가 부담해야 하는 손해배상금과 방어비용을 담보한다."],"answer":3,"explanation":"회사가 임원 대신 부담한 배상금·방어비용은 회사보상조항(Company Reimbursement)에서 담보한다. 임원배상책임담보조항은 임원 개인이 부담하는 손해를 담보한다. 근거 28-24","tag":"배상상품","questionPage":15,"explanationPage":9},{"id":"8-19","round":8,"number":19,"stem":"기계보험의 보험금 지급에 대한 설명으로 옳은 것은?","conditions":"","options":["분손과 전부손해 모두 사고 당시 시가로 보상한다.","화재로 인한 기계 손해도 기계보험에서 보상한다.","보험가입금액은 사고 당시 시가를 기준으로 정한다.","분손이면 감가상각 없이 수리·신품교환 비용으로 보상하고, 전부손해이면 신구교환공제를 한다."],"answer":3,"explanation":"기계보험은 신조달가액으로 가입하고, 분손은 감가상각 없이, 전부손해는 신구교환공제 후 보상한다. 화재는 면책이다. 근거 교재 p.165, 24-25","tag":"기술","questionPage":15,"explanationPage":9},{"id":"8-20","round":8,"number":20,"stem":"「개인정보 보호법」에 따른 개인정보 손해배상책임 보장제도 (2024.3.15 시행 개정법 기준)에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["직전 사업연도 매출액이 10억 원 이상이고 정보주체 수가 일평균 1만 명 이상인 개인정보처리자가 대상이다.","의무 대상이 되면 피해 규모와 관계없이 피해자 손해 전액을 보험으로 보상해야 하므로 최저가입금액 제도는 없다.","보험이나 공제에 가입하는 대신 준비금을 적립하는 방법으로도 의무를 이행할 수 있다.","최저가입금액은 매출액과 정보주체 수에 따라 5천만 원에서 10억 원까지 구간별로 정해진다."],"answer":1,"explanation":"개인정보 손해배상책임 보장제도는 매출액·정보주체 수에 따라 최저가입금액(5천만~10억 원)을 정해 둔다. 대상 기준은 개정 논의가 있으므로 시험 직전에 확인한다. 근거 신규(시사), 26-18","tag":"의무·해상","questionPage":15,"explanationPage":9},{"id":"8-21","round":8,"number":21,"stem":"근로자재해보장책임보험의 사용자배상책임 특별약관에 대한 설명으로 옳은 것은?","conditions":"","options":["재해보상책임 특별약관이나 산재보험법에 따른 급부 여부와 관계없이 피보험자가 근로자에게 부담하는 손해배상금을 보상한다.","보상하는 손해배상금에 지연배상금은 포함하지 않는다.","피보험자가 아닌 다른 자연인 또는 법인에 사실상 고용되어 있는 동안 생긴 손해도 보상한다.","피보험자가 손해배상 소송을 위해 회사의 서면동의를 받아 지급한 비용은 보상한다."],"answer":3,"explanation":"회사의 서면동의를 받은 소송비용은 보상한다. 급부 전제가 필요하고, 지연배상금은 포함되며, 다른 자에게 사실상 고용된 동안의 손해는 보상하지 않는다. 근거 27-19","tag":"근재","questionPage":15,"explanationPage":9},{"id":"8-22","round":8,"number":22,"stem":"금융기관 관련 보험에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["금융기관종합보험(BBB)은 금융기관 영업활동 중 발생하는 재물·도난 손실 등을 담보한다.","금융기관종합보험(BBB)은 창구직원의 계산착오로 인한 손실도 담보한다.","금융기관전문인배상책임보험(FIPI)은 금융기관이 고객에게 제공하는 전문서비스에 대한 배상책임을 담보한다.","임원배상책임보험(D&O)의 피보험자는 임원이다."],"answer":1,"explanation":"창구직원의 계산착오로 인한 손실은 BBB의 면책 사항이다(교재 p.166 비교표). 근거 교재 p.166, 24-23","tag":"기타특종","questionPage":15,"explanationPage":9},{"id":"8-23","round":8,"number":23,"stem":"패키지보험 제2부문(기계위험담보)에서 보상하는 손해에 해당하지 않는 것은?","conditions":"","options":["운전 중 기계의 과열로 인한 화재","재질, 설계, 조립상의 결함","과전압, 절연체의 하자, 단락, 방전","종업원 또는 제3자의 능력 부족, 기술 부족"],"answer":0,"explanation":"화재는 제1부문(PAR)에서 담보하므로 제2부문(MB)에서는 면책이다. 두 부문의 담보가 겹치지 않게 나눠져 있다. 근거 교재 p.221, 29-25","tag":"패키지","questionPage":15,"explanationPage":9},{"id":"8-24","round":8,"number":24,"stem":"전자기기보험에서 보상하지 않는 위험은?","conditions":"","options":["망실, 분실","화재","낙뢰","폭발"],"answer":0,"explanation":"전자기기보험은 전위험담보이지만 원인을 알 수 없는 망실·분실은 면책이다. 근거 27-25","tag":"기술","questionPage":15,"explanationPage":9},{"id":"8-25","round":8,"number":25,"stem":"국문 동산종합보험으로 담보할 수 있는 보험의 목적에 해당하는 것은?","conditions":"","options":["수용장소가 특정되어 있는 상품","자동차, 선박, 항공기","전시품, 전시상품","특정구간 수송 중의 위험만을 대상으로 하는 동산"],"answer":2,"explanation":"수용장소가 특정된 상품(화재보험), 자동차·선박·항공기(각 전용 보험), 특정구간 수송(적하보험)은 다른 보험과의 영역 조정으로 제외된다. 전시품은 담보할 수 있다. 근거 교재 p.220, 28-21","tag":"기타특종","questionPage":15,"explanationPage":9},{"id":"8-26","round":8,"number":26,"stem":"보증보험에 대한 설명으로 가장 옳지 않은 것은?","conditions":"","options":["보증보험 증권의 보증내용에 주계약서와 다른 내용을 포함할 수 있다.","보험회사, 보험계약자, 그리고 계약자와 다른 피보험자가 존재한다.","신용보험과 보증보험은 모두 계약상 채무불이행을 담보한다.","보험사고는 불법행위나 채무·의무 불이행으로 발생한다."],"answer":0,"explanation":"보증채무는 주채무에 종속되므로(부종성) 주계약과 다른 내용을 보증할 수 없다. 근거 23-26, 27-30","tag":"보증총론","questionPage":15,"explanationPage":9},{"id":"8-27","round":8,"number":27,"stem":"보증보험 상품과 당사자의 연결로 옳지 않은 것은?","conditions":"","options":["신원보증보험 – 계약자: 직원(피보증인), 피보험자: 회사","교육훈련비보증보험 – 계약자: 회사, 피보험자: 교육훈련을 받는 직원","생활안정자금보증보험 – 계약자: 대출받은 직원, 피보험자: 회사","교육훈련비보증보험 – 계약자: 교육훈련을 받는 직원, 피보험자: 회사"],"answer":1,"explanation":"교육훈련비보증은 교육훈련을 받은 직원이 의무(근무기간 등)를 이행하지 않을 때 회사가 돌려받아야 할 비용을 보상하므로, 계약자는 직원이고 피보험자는 회사이다. 근거 교재 p.173, 30-30","tag":"보증상품","questionPage":16,"explanationPage":9},{"id":"8-28","round":8,"number":28,"stem":"보증(신용)보험 상품에 대한 설명으로 가장 옳지 않은 것은?","conditions":"","options":["전세금보장신용보험은 보험계약자와 피보험자가 동일하다.","임대주택보증보험의 보험계약자는 「민간임대주택에 관한 특별법」에 따른 민간임대사업자이다.","전세임대주택신용보험의 보험계약자 겸 피보험자는 임대주택 소유자(임대인)이다.","상가보증금보장신용보험은 상가 임대인이 임차보증금을 반환하지 않아 임차인이 입은 손해를 보상한다."],"answer":2,"explanation":"전세임대주택신용보험은 임대인의 보증금 반환채무 불이행에 대비하는 상품이므로, 보증금을 돌려받아야 하는 임차인 측(LH 등 전세임대사업자)이 계약자 겸 피보험자이다. 근거 31-28, 30-29","tag":"보증상품","questionPage":16,"explanationPage":9},{"id":"8-29","round":8,"number":29,"stem":"이행(계약)보증보험에서 주계약에 계약보증금 몰수·귀속 조항이 없어 실손해를 보상하는 경우, 아래 조건에서 보험회사가 지급할 보험금은?","conditions":"공사계약금액 80억 원 (보험가입금액 8억 원)\n기성(타절)금액 50억 원 · 잔여공사금액 30억 원\n잔여공사를 이행하기 위해 다른 업체와 계약한 금액 42억 원","options":["4억 원","8억 원","12억 원","30억 원"],"answer":1,"explanation":"실손해는 42억 − 30억 = 12억 원이지만 보험가입금액 8억 원을 한도로 보상하므로 8억 원이다. 근거 24-29","tag":"보증상품","questionPage":16,"explanationPage":10},{"id":"8-30","round":8,"number":30,"stem":"신용보험 상품에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["개인금융신용보험의 인수대상 주계약은 금전소비대차계약이다.","매출채권신용보험의 보험가입금액은 매출액 방식과 신용한도액 방식이 있다.","상생선금신용보험은 도급·매매계약에서 선금을 받는 수급인이 발주자를 위해 가입하는 상품이다.","전세금보장신용보험의 보험계약자는 임차인이다."],"answer":2,"explanation":"상생선금신용보험은 선금을 지급하는 자가 스스로 채권 확보를 위해 가입하는 신용보험이다. 근거 27-28","tag":"보증상품","questionPage":16,"explanationPage":10},{"id":"9-16","round":9,"number":16,"stem":"국문 영업배상책임보험의 보험금 지급한도에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["손해배상금은 보상한도액을 한도로 하되, 자기부담금이 약정되면 그 초과분만 보상한다.","손해방지비용은 손해배상금과 합쳐 보상한도액 내에서만 보상한다.","소송비용, 변호사비용 등은 자기부담금을 적용하지 않고 손해배상금과 합쳐 보상한도액 내에서 보상한다.","보험기간 중 사고에 대한 회사의 보상총액은 증권에 기재된 총보상한도액을 초과하지 않는다."],"answer":1,"explanation":"손해의 방지·경감을 위해 지출한 비용은 보상한도액을 초과하더라도 보상한다. 소송비용·공탁보증보험료는 손해배상금과 합쳐 보상한도액 내에서 보상한다. 근거 24-16","tag":"영업배상","questionPage":17,"explanationPage":10},{"id":"9-17","round":9,"number":17,"stem":"철도, 도로, 터널, 교량, 부두 등의 사용 또는 운영 중 발생하는 위험을 담보하기에 가장 적합한 보험종목은?","conditions":"","options":["건설공사보험(CAR)","완성토목공사물보험(CCAR)","패키지보험(Package Insurance)","기관기계종합보험(CMI)"],"answer":1,"explanation":"공사가 끝나 운영 중인 토목구조물은 완성토목공사물보험으로 담보한다. 건설공사보험은 인도 전 공사기간을 담보한다. 근거 31-20, 30-22","tag":"기술","questionPage":17,"explanationPage":10},{"id":"9-18","round":9,"number":18,"stem":"국문 생산물배상책임보험 보통약관의 용어 정의로 옳지 않은 것은?","conditions":"","options":["생산물이란 피보험자가 제조, 가공 또는 공급한 생산물과 시공한 작업(완성작업)을 말한다.","하나의 원인 또는 같은 종류의 위험에 계속적·반복적·누적적으로 노출되어 생긴 사고는 피해자 수나 청구 수와 관계없이 1회의 사고로 본다.","재물손해란 물리적으로 망그러뜨려진 유체물의 직접손해와 그 유체물의 사용불능으로 생긴 간접손해만을 말한다.","신체장해란 신체의 상해, 질병 및 그로 인한 사망을 말한다."],"answer":2,"explanation":"재물손해에는 망그러지지 않은 유체물의 사용불능 손해도 포함되므로 '~만을 말한다'는 틀린 설명이다. 근거 23-19","tag":"배상상품","questionPage":17,"explanationPage":10},{"id":"9-19","round":9,"number":19,"stem":"근로자재해보장책임보험의 사용자배상책임 특별약관에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["산재보험이나 재해보상책임 특별약관에 가입되어 있어야 가입할 수 있다.","보험계약자는 사용자이고 피보험자는 근로자이다.","보상 대상 사고는 업무상 재해로서 사용자의 과실에 기인한 업무상 사고이다.","업무 중 재해로 근로자가 사망하거나 후유장해가 생긴 경우 사용자의 민사상 배상책임과 소송비용을 보상한다."],"answer":1,"explanation":"사용자배상책임은 사용자 자신의 배상책임을 담보하므로 계약자와 피보험자 모두 사용자이다. 근거 28-23","tag":"근재","questionPage":17,"explanationPage":10},{"id":"9-20","round":9,"number":20,"stem":"패키지보험의 소규모공사조항(Minor Works Clause)에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["보험증권에 기재된 공사계약금액을 초과하는 건설공사에는 적용되지 않는다.","통상적인 운전과정에서 발생하는 변경, 유지, 수정 작업에는 적용되지 않는다.","소규모공사의 지연에 따른 예정이익상실은 보상하지 않는다.","소규모공사를 담보하는 다른 보험계약이 있으면 이 조항은 적용되지 않는다."],"answer":3,"explanation":"다른 보험이 있어도 적용이 배제되지 않고, 다른 보험의 담보액을 초과하는 부분을 담보한다. 근거 23-23, 31-16","tag":"패키지","questionPage":17,"explanationPage":10},{"id":"9-21","round":9,"number":21,"stem":"가스사고배상책임보험에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["관련 법규에 따라 가스사업자, 용기제조업자, 법정 가스사용자가 의무적으로 가입하는 강제보험이다.","1인당·1사고당 보상한도액은 있지만 총보상한도액은 없다.","배출시설에서 통상적으로 배출되는 배수, 배기 또는 연기로 생긴 배상책임도 담보한다.","가스사용자는 시설 소유·관리에 대한 배상책임을 부담한다."],"answer":2,"explanation":"통상적으로 배출되는 배수·배기·연기로 인한 손해는 우연한 가스사고가 아니므로 담보하지 않는다. 근거 27-18","tag":"의무·해상","questionPage":17,"explanationPage":10},{"id":"9-22","round":9,"number":22,"stem":"국문 영업배상책임보험의 구내치료비 담보 추가특별약관에 대한 설명으로 옳은 것은?","conditions":"","options":["피보험자의 법률상 배상책임이 성립해야만 치료비를 보상한다.","피해자의 과실만큼 과실상계하여 치료비를 보상한다.","치료비 외에 위자료와 일실수입도 보상한다.","피보험자의 배상책임 유무와 관계없이(무과실) 과실상계 없이 치료비를 보상한다."],"answer":3,"explanation":"구내치료비 추가특약은 시설 구내 사고 피해자의 치료비를 배상책임 성립 여부나 과실상계 없이 보상한다(치료비 한정). 근거 교재 p.155","tag":"영업배상","questionPage":17,"explanationPage":10},{"id":"9-23","round":9,"number":23,"stem":"국문 건설공사보험에서 보통약관이 아니라 별도의 특별약관으로 담보하는 것이 아닌 것은?","conditions":"","options":["공사용 기계·장비의 손해","공사목적물 자체의 손해","주위재산의 손해","제3자에 대한 배상책임"],"answer":1,"explanation":"공사목적물과 임시 가설물은 보통약관에서 담보한다. 공사용 기계, 주위재산, 잔존물제거비용, 제3자 배상책임, ALOP는 특약으로 담보한다. 근거 교재 p.165, 28-20","tag":"기술","questionPage":17,"explanationPage":10},{"id":"9-24","round":9,"number":24,"stem":"패키지보험 제1부문(재산종합위험담보)의 확장담보조항에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["소방비용조항은 부보자산의 손해 확대를 방지·최소화하기 위해 필요하고 유익하게 지출한 소방비용을 보상한다.","소규모공사조항은 공사금액이 일정액을 넘지 않는 소규모 공사 중의 위험을 담보하되 예정이익 상실은 보상하지 않는다.","추가재산조항은 별도로 부보되지 않은 신규 건물·기계장치 등을 담보하되 그 명세를 일정 기간 내에 보험자에게 제출하여야 한다.","일시적 철거조항은 청소, 개량, 수리를 위해 일시적으로 철거되어 이동하는 중 발생한 손해를 담보하며, 기계장치·시설·동산을 일괄 포함한다."],"answer":3,"explanation":"기출(24-19)은 일시적 철거조항에서 '동산을 일괄 포함한다'는 부분을 틀린 지문으로 처리하였다. 근거 24-19","tag":"패키지","questionPage":17,"explanationPage":10},{"id":"9-25","round":9,"number":25,"stem":"금융기관종합보험(BBB)에서 보상하지 않는 손해는?","conditions":"","options":["피보험자 고용인의 부정행위에 의한 손해","사업장 내에서 발생한 도난, 절도, 강도로 인한 재물손실","수표, 어음, 신용장, 예금증서 등의 서명이 위조 또는 변조되어 입은 손실","보안경비회사나 무장호송차량회사가 아닌 일반운송회사의 관리 아래 있는 재물의 손실"],"answer":3,"explanation":"운송 중 재물은 보안경비회사·무장호송회사가 관리하는 경우에 담보하며, 일반운송회사가 관리하는 재물은 보상하지 않는다. 근거 29-22","tag":"기타특종","questionPage":17,"explanationPage":10},{"id":"9-26","round":9,"number":26,"stem":"다음 보증보험 상품 중 보험계약자(또는 채무자)의 신용도와 무관하게 보험요율이 적용되는 상품은?","conditions":"","options":["계약보증보험","하자보증보험","전세금보장신용보험","개인금융신용보험"],"answer":2,"explanation":"전세금보장신용보험은 임차인 자신의 신용과 관계없이 보증금 규모 등에 따라 요율이 정해진다. 근거 28-28, 26-28","tag":"보증총론","questionPage":18,"explanationPage":10},{"id":"9-27","round":9,"number":27,"stem":"보증보험의 법적 성격과 운영에 대한 설명으로 옳은 것은?","conditions":"","options":["보험회사는 보험금을 지급한 후 보험계약자에게 구상권을 행사할 수 있다.","보험사고의 인위성(고의)이 없어 도덕적 위험이 거의 없다.","보증채무는 주채무와 무관하게 독립적으로 성립한다.","일반 손해보험처럼 보험계약자가 언제든지 임의로 해지할 수 있다."],"answer":0,"explanation":"보증보험은 채무자(계약자)를 대신해 지급한 것이므로 계약자에게 구상권을 행사한다. 보험사고에 인위성이 있고, 부종성이 있으며, 계약자 임의 해지가 제한된다. 근거 교재 p.173, 23-30","tag":"보증총론","questionPage":18,"explanationPage":10},{"id":"9-28","round":9,"number":28,"stem":"해외 건설공사 수주와 관련된 보증과 그 영문 명칭의 연결로 옳지 않은 것은?","conditions":"","options":["입찰보증 – Bid Bond","계약이행보증 – Performance Bond","하자보증 – Counter Guarantee Bond","선수금환급보증 – Advance Payment Bond"],"answer":2,"explanation":"하자보증은 Maintenance Bond이다. Counter Guarantee Bond는 발주국 보증인을 위해 발급하는 구상보증이다. 근거 교재 p.174, 25-30","tag":"보증상품","questionPage":18,"explanationPage":10},{"id":"9-29","round":9,"number":29,"stem":"이행(상품판매대금)보증보험 약관에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["계약자·피보험자 등의 사기로 계약이 성립된 경우 회사는 사기 사실을 안 날부터 3개월 이내, 계약체결일부터 5년 이내에 계약을 취소할 수 있다.","보험계약자가 증권에 기재된 계약에서 정한 외상물품대금 지급채무를 이행하지 않아 피보험자가 입은 손해를 보상한다.","보험의 목적의 양도는 보험회사의 서면동의 없이는 회사에 대하여 효력이 없다.","보험금청구권과 보험료반환청구권은 3년간 행사하지 않으면 소멸시효가 완성된다."],"answer":0,"explanation":"기출(25-28)에서 '안 날부터 3개월'이 틀린 지문으로 처리되었다. 사기에 의한 계약 취소는 '안 날부터 1개월, 계약일부터 5년' 구조이다. 근거 25-28","tag":"보증상품","questionPage":18,"explanationPage":11},{"id":"9-30","round":9,"number":30,"stem":"보험증권에 기재된 사건으로 권리자인 피보험자가 손해배상청구권에 관한 확정된 집행권원을 받음으로써, 담보제공 의무자인 보험계약자가 피보험자에게 배상하여야 할 손해를 보상하는 보험상품은?","conditions":"","options":["공탁보증보험","납세보증보험","보석보증보험","인·허가보증보험"],"answer":0,"explanation":"가압류·가처분 등을 신청하면서 법원에 내야 하는 담보를 대신하는 것이 공탁보증보험이다. 근거 23-27","tag":"보증상품","questionPage":18,"explanationPage":11},{"id":"10-16","round":10,"number":16,"stem":"요양보호사의 부주의로 돌보던 환자가 부상을 입은 경우의 배상책임위험을 담보하기에 가장 적합한 상품은?","conditions":"","options":["시설소유관리자배상책임보험","보관자배상책임보험","일상생활배상책임보험","전문인배상책임보험"],"answer":3,"explanation":"자격을 갖춘 전문인이 전문업무(요양보호) 수행 중 과실로 고객에게 입힌 손해는 전문인배상책임보험의 영역이다. 근거 25-25","tag":"배상상품","questionPage":19,"explanationPage":11},{"id":"10-17","round":10,"number":17,"stem":"다음 위험과 가장 적합한 보험의 연결로 옳지 않은 것은?","conditions":"","options":["신축 중인 아파트 공사현장의 붕괴 – 건설공사보험","발전소 터빈 설치공사 중 사고 – 조립보험","공사가 끝나 운영 중인 교량의 홍수 피해 – 건설공사보험","시운전을 마치고 가동 중인 공장 기계의 고장 – 기계보험"],"answer":2,"explanation":"공사가 끝나 운영 중인 교량은 완성토목공사물보험(CCAR)으로 담보한다. 건설공사보험은 발주자에게 인도되기 전까지만 담보한다. 근거 31-20, 26-19, 25-19","tag":"기술","questionPage":19,"explanationPage":11},{"id":"10-18","round":10,"number":18,"stem":"국문 영업배상책임보험 특별약관과 담보 내용의 연결로 옳지 않은 것은?","conditions":"","options":["도급업자 – 수급한 공사 중 발생한 제3자 배상책임과 공사물건 자체의 손해","시설소유관리자 – 시설 및 그 용도에 따른 업무 수행 중 사고로 인한 제3자 배상책임","임차자 – 임차한 시설에 대한 보관자 배상책임","차량정비업자 – 정비를 위해 맡은 차량에 대한 보관자 배상책임과 작업 중 제3자 배상책임"],"answer":0,"explanation":"도급업자 특약은 제3자 배상책임만 담보하며, 공사물건 자체의 손해는 보상하지 않는다(건설공사보험 영역). 근거 30-17, 24-21","tag":"영업배상","questionPage":19,"explanationPage":11},{"id":"10-19","round":10,"number":19,"stem":"다음 중 의무보험이 아닌 것은?","conditions":"","options":["산후조리원배상책임보험","재난배상책임보험","개인정보보호배상책임보험","풍수해보험"],"answer":3,"explanation":"풍수해보험은 정부가 보험료를 지원하는 정책보험이지만 가입이 강제되지는 않는다. 근거 26-18","tag":"의무·해상","questionPage":19,"explanationPage":11},{"id":"10-20","round":10,"number":20,"stem":"근로자재해보장책임보험의 사용자배상책임 특별약관에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["재해보상책임 특별약관과 재해보상 관련 법령에 따른 보상금액을 초과하여 피보험자가 부담하는 법률상 배상책임을 보상한다.","재해보상책임 특별약관 및 산재보험법에 따른 급부가 이루어진 경우에 한하여 보상한다.","소음으로 생긴 손해에 대한 배상책임도 보상한다.","법률상 손해배상금 외에 피보험자가 지급한 소송비용과 변호사비용도 보상한다."],"answer":2,"explanation":"소음으로 인한 손해(소음성 난청 등)는 사용자배상책임 특약에서 면책이다. 근거 23-21","tag":"근재","questionPage":19,"explanationPage":11},{"id":"10-21","round":10,"number":21,"stem":"기업중대사고 배상책임보험에서 특별약관을 첨부하는 경우에도 담보하지 않는 것은?","conditions":"","options":["징벌적 손해배상금","형사방어비용","위기관리실행비용","벌금"],"answer":3,"explanation":"징벌적 손해배상금·형사방어비용·위기관리실행비용은 특약으로 담보할 수 있지만 벌금은 어떤 경우에도 담보하지 않는다. 근거 28-18, 30-23","tag":"배상상품","questionPage":19,"explanationPage":11},{"id":"10-22","round":10,"number":22,"stem":"패키지보험 제4부문(배상책임위험담보, General Liability)에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["피보험자 소유 재물의 직접손해를 담보한다.","시설의 소유·관리와 영업활동에 관련된 제3자 배상책임을 담보한다.","급격한 오염사고로 인한 배상책임을 담보할 수 있다.","교차배상책임 확장담보는 피보험자 상호간의 배상책임을 담보한다."],"answer":0,"explanation":"제4부문은 제3자에 대한 배상책임을 담보한다. 피보험자 소유 재물의 직접손해는 제1부문(PAR)의 영역이다. 근거 30-19, 교재 p.166","tag":"패키지","questionPage":19,"explanationPage":11},{"id":"10-23","round":10,"number":23,"stem":"골프보험에 대한 설명으로 옳은 것은?","conditions":"","options":["골프장 경영자나 사용인(임시고용인 포함)이 자기가 경영하거나 근무하는 골프장에서 한 홀인원은 홀인원비용 특별약관에서 보상하지 않는다.","배상책임손해는 특별약관으로만 담보한다.","골프용품의 손해는 재조달가액으로 보상한다.","회사의 책임은 보험기간 첫날 0시에 시작한다."],"answer":0,"explanation":"골프장 관계자의 자기 골프장 홀인원은 보상하지 않는다. 배상책임은 기본 담보, 골프용품은 시가 보상, 책임은 첫날 오후 4시에 시작한다. 근거 30-25","tag":"기타특종","questionPage":19,"explanationPage":11},{"id":"10-24","round":10,"number":24,"stem":"기계보험에 대한 설명으로 옳은 것은?","conditions":"","options":["화재로 인한 손해도 기계보험에서 보상하므로 화재보험이 필요 없다.","소모성 부품, 공구류·형류는 보험목적에서 제외된다.","보험가입금액은 감가상각을 반영한 시가로 정한다.","사업장 밖으로 반출된 기계도 담보한다."],"answer":1,"explanation":"마모·소모성 부품, 공구류·형류, 연료·윤활유·냉매는 보험목적에서 제외된다. 기계보험은 화재 면책, 신조달가액 가입, 사업장 구내 기계가 대상이다. 근거 교재 p.165, 31-18","tag":"기술","questionPage":19,"explanationPage":11},{"id":"10-25","round":10,"number":25,"stem":"국문 동산종합보험에서 보상하지 않는 손해는?","conditions":"","options":["화재로 인한 손해","도난으로 인한 손해","보험목적의 전기적·기계적 사고로 생긴 손해","수송 중 파손된 손해"],"answer":2,"explanation":"동산종합보험은 포괄담보이지만 보험목적의 전기적·기계적 사고 손해는 면책이다(기계·전자기기보험 영역). 근거 28-21, 교재 p.222","tag":"기타특종","questionPage":19,"explanationPage":11},{"id":"10-26","round":10,"number":26,"stem":"다음 설명에 해당하는 보증채무의 성질은?","conditions":"주채무가 무효이거나 취소되면 보증채무도 효력을 잃고, 주채무가 변제 등으로 소멸하면 보증채무도 함께 소멸한다.","options":["수반성","부종성","보충성","독립성"],"answer":1,"explanation":"주채무의 성립·소멸에 보증채무가 따르는 성질이 부종성이다. 수반성은 주채권이 이전되면 보증채권도 함께 이전되는 성질, 보충성은 주채무자가 이행하지 않을 때 비로소 이행하는 성질이다. 근거 27-30, 23-26","tag":"보증총론","questionPage":19,"explanationPage":11},{"id":"10-27","round":10,"number":27,"stem":"법률상 채무불이행을 담보하는 보증보험 상품이 아닌 것은?","conditions":"","options":["설계감리보증보험","납세보증보험","프랜차이즈보증보험","병무귀국보증보험"],"answer":0,"explanation":"설계감리보증보험은 설계·감리 용역계약상의 의무를 담보한다. 납세·프랜차이즈(예치가맹금)·병무귀국은 법령상 의무를 담보한다. 근거 26-30","tag":"보증상품","questionPage":19,"explanationPage":11},{"id":"10-28","round":10,"number":28,"stem":"개인 임차인을 가입대상으로 하는 전세금보장신용보험에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["주택임대차보호법상 임차인의 대항력과 우선변제권을 확보해야 한다.","임차보증금 전액을 보험가입금액으로 하는 것이 원칙이다.","납입보험료는 연말정산 시 특별세액공제를 받을 수 있다.","집주인(임대인)의 사전동의가 있어야 가입할 수 있다."],"answer":3,"explanation":"전세금보장신용보험은 임차인이 자기를 위해 가입하는 신용보험으로 임대인의 사전동의가 필요 없다. 근거 29-29","tag":"보증상품","questionPage":20,"explanationPage":12},{"id":"10-29","round":10,"number":29,"stem":"보증보험 상품에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["납세보증보험의 피보험자는 국가 또는 지방자치단체이다.","전세금보장신용보험의 보험계약자는 임차인이다.","공탁보증보험의 피보험자는 가압류 등 민사사건의 신청인이다.","기업금융보증보험의 주계약은 금전소비대차계약이다."],"answer":2,"explanation":"가압류 등의 신청인은 공탁보증보험의 계약자(담보제공 의무자)이다. 피보험자는 그로 인해 손해를 입어 집행권원을 받은 상대방(권리자)이다. 근거 28-30, 23-27","tag":"보증상품","questionPage":20,"explanationPage":12},{"id":"10-30","round":10,"number":30,"stem":"상가 임차인을 위한 신용보험에 대한 설명으로 옳지 않은 것은?","conditions":"","options":["상가보증금보장신용보험은 임대인이 임차보증금을 반환하지 않아 임차인이 입은 손해를 보상한다.","두 상품 모두 임대인이 보험계약자가 되는 타인을 위한 보험이다.","권리금보호신용보험은 임대인의 권리금 회수기회 방해행위로 임차인이 입은 손해를 보상한다.","두 상품 모두 임차인이 보험계약자 겸 피보험자가 된다."],"answer":1,"explanation":"두 상품은 임차인이 계약자 겸 피보험자인 신용보험(자기를 위한 보험)이다. 근거 교재 p.174, 25-26, 27-29","tag":"보증상품","questionPage":20,"explanationPage":12}]</script>
<script>
'use strict';
const questions = JSON.parse(document.getElementById('questions').textContent);
const byId = new Map(questions.map(q => [q.id, q]));
const storageKey = 'broker-quiz-v1';
const version = 'liability-150-v1';
const $ = id => document.getElementById(id);
const symbols = ['①','②','③','④'];
let canSave = true;
function freshState() {
  const order = questions.map(q => q.id);
  for (let i=order.length-1;i>0;i--) {const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  return {version,order,position:0,answers:{},uncertain:[]};
}
function validState(s) {
  return s && s.version===version && Array.isArray(s.order) && s.order.length===questions.length && new Set(s.order).size===questions.length && s.order.every(id=>byId.has(id)) && Number.isInteger(s.position) && s.position>=0 && s.position<questions.length && s.answers && typeof s.answers==='object' && !Array.isArray(s.answers) && Object.entries(s.answers).every(([id,n])=>byId.has(id)&&Number.isInteger(n)&&n>=0&&n<4);
}
function storageUnavailable() {
  canSave=false;
  $('storage-warning').textContent='이 브라우저에서는 진행 상황을 저장할 수 없습니다. 지금은 계속 풀 수 있지만 창을 닫으면 기록이 사라집니다.';
  $('storage-warning').hidden=false;
  $('save-note').textContent='답을 고르면 바로 채점됩니다. 현재 실행 중에만 기록이 유지됩니다.';
}
function load() {
  let raw;
  try {raw=localStorage.getItem(storageKey);} catch {storageUnavailable();return freshState();}
  if(raw) {
    try {const parsed=JSON.parse(raw);if(validState(parsed)){
      parsed.uncertain=Array.isArray(parsed.uncertain)?[...new Set(parsed.uncertain.filter(id=>byId.has(id)))]:[];
      return parsed;
    }} catch {}
    $('storage-warning').textContent='저장된 기록을 읽을 수 없어 새 문제 순서로 시작합니다.';
    $('storage-warning').hidden=false;
  }
  return freshState();
}
let state=load();
let wasComplete=Object.keys(state.answers).length===questions.length;
function reviewRows() {
  return state.order.map((id,index)=>({q:byId.get(id),index,chosen:state.answers[id],flag:state.uncertain.includes(id)}))
    .filter(r=>r.flag || (r.chosen!==undefined && r.chosen!==r.q.answer));
}
function reviewStatus(row) {
  return (row.chosen===undefined?'미응답':row.chosen===row.q.answer?'정답':'오답')+(row.flag?' · 헷갈림':'');
}
function renderReview() {
  const rows=reviewRows();
  const wrong=rows.filter(r=>r.chosen!==undefined && r.chosen!==r.q.answer).length;
  $('review-toggle').textContent=`복습 로그 (${rows.length})`;
  $('review-count').textContent=`오답 ${wrong}문제 · 헷갈림 ${state.uncertain.length}문제 · 중복 제외 ${rows.length}문제`;
  $('review-list').replaceChildren();
  if(!rows.length){$('review-list').textContent='아직 틀리거나 헷갈림으로 표시한 문제가 없습니다.';return;}
  for(const row of rows){
    const item=document.createElement('div');item.className='review-item';
    const link=document.createElement('button');link.textContent=`풀이 ${row.index+1}번 · 제${row.q.round}회 ${row.q.number}번`;
    link.addEventListener('click',()=>{state.position=row.index;save();render();$('stem').focus();});
    const status=document.createElement('p');status.className='review-status';status.textContent=reviewStatus(row)+(row.chosen===undefined?'':` · 내 답 ${symbols[row.chosen]} / 정답 ${symbols[row.q.answer]}`);
    const stem=document.createElement('p');stem.textContent=row.q.stem;
    item.append(link,status,stem);$('review-list').append(item);
  }
}
function showReview(show) {$('review-panel').hidden=!show;$('review-toggle').setAttribute('aria-expanded',String(show));}
function save() {if(canSave)try {localStorage.setItem(storageKey,JSON.stringify(state));} catch {storageUnavailable();}}
function render() {
  const q=byId.get(state.order[state.position]), chosen=state.answers[q.id];
  const answered=Object.keys(state.answers).length;
  const correct=Object.entries(state.answers).filter(([id,n])=>byId.get(id).answer===n).length;
  $('position').textContent=`문제 ${state.position+1} / ${questions.length}`;
  $('score').textContent=`풀이 ${answered} / ${questions.length} · 정답 ${correct}`;
  $('progress').value=answered;
  $('round').textContent=`제${q.round}회`;
  $('original-number').textContent=`원문 ${q.number}번`;
  $('uncertain').checked=state.uncertain.includes(q.id);
  $('stem').textContent=q.stem;
  $('conditions').textContent=q.conditions;
  $('conditions').hidden=!q.conditions;
  $('options').replaceChildren();
  q.options.forEach((text,i)=>{
    const button=document.createElement('button');button.className='option';button.disabled=chosen!==undefined;
    const number=document.createElement('span');number.className='number';number.textContent=i+1;number.setAttribute('aria-hidden','true');
    const content=document.createElement('span');content.className='choice-text';content.textContent=text;
    button.append(number,content);button.setAttribute('aria-label',`${symbols[i]} ${text}`);
    if(chosen!==undefined && (i===q.answer || i===chosen)) {
      const label=document.createElement('span');label.className='choice-label';
      if(i===q.answer){button.classList.add('correct');label.textContent=i===chosen?'내 답 · 정답':'정답';}
      else {button.classList.add('wrong');label.textContent='내 답';}
      button.append(label);
    }
    button.addEventListener('click',()=>{
      if(state.answers[q.id]!==undefined)return;
      state.answers[q.id]=i;save();render();
      // Keep keyboard users in the question flow after all choices become disabled.
      $('verdict').setAttribute('tabindex','-1');$('verdict').focus({preventScroll:true});
    });
    $('options').append(button);
  });
  $('feedback').hidden=chosen===undefined;
  if(chosen!==undefined) {
    $('feedback').className=chosen===q.answer?'good':'bad';
    $('verdict').textContent=chosen===q.answer?'정답입니다.':'오답입니다.';
    $('answer-line').textContent=`정답 ${symbols[q.answer]} · 내가 고른 답 ${symbols[chosen]}`;
    $('explanation-title').textContent=`해설 · ${q.tag}`;
    $('explanation').textContent=q.explanation;
    $('source').textContent=`출처: 제공된 문제지 ${q.questionPage}쪽 · 정답 및 해설 ${q.explanationPage}쪽 (제${q.round}회 ${q.number}번)`;
  } else {for(const id of ['verdict','answer-line','explanation','source'])$(id).textContent='';}
  $('previous').disabled=state.position===0;
  $('next').disabled=state.position===questions.length-1;
  $('summary').hidden=answered!==questions.length;
  $('summary').textContent=answered===questions.length?`모두 풀었습니다! ${questions.length}문제 중 ${correct}문제 정답 · 정답률 ${Math.round(correct/questions.length*100)}%`:'';
  const complete=answered===questions.length;
  if(complete&&!wasComplete)showReview(true);
  wasComplete=complete;
  renderReview();
}
function move(delta) {state.position=Math.max(0,Math.min(questions.length-1,state.position+delta));save();render();$('stem').focus();}
$('previous').addEventListener('click',()=>move(-1));
$('next').addEventListener('click',()=>move(1));
$('uncertain').addEventListener('change',()=>{
  const id=state.order[state.position];
  state.uncertain=state.uncertain.filter(value=>value!==id);
  if($('uncertain').checked)state.uncertain.push(id);
  save();renderReview();
});
$('review-toggle').addEventListener('click',()=>showReview($('review-panel').hidden));
function transferMessage(message) {$('transfer-status').textContent=message;$('transfer-status').hidden=false;}
$('export-progress').addEventListener('click',()=>{
  const backup={format:'broker-quiz-progress',formatVersion:1,exportedAt:new Date().toISOString(),state};
  const url=URL.createObjectURL(new Blob([JSON.stringify(backup,null,2)],{type:'application/json;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download=`손해보험중개사_진행기록_${Date.now()}.json`;
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
  transferMessage('진행 기록 파일 다운로드를 요청했습니다. 저장된 JSON 파일과 index.html을 함께 옮겨 주세요.');
});
$('import-progress').addEventListener('click',()=>$('import-file').click());
$('import-file').addEventListener('change',async()=>{
  const file=$('import-file').files[0];if(!file)return;
  $('import-progress').disabled=true;
  try {
    if(file.size>1024*1024)throw new Error('파일 크기가 너무 큽니다.');
    const backup=JSON.parse((await file.text()).replace(/^\uFEFF/,''));
    const s=backup?.state;
    if(backup?.format!=='broker-quiz-progress'||backup.formatVersion!==1||!validState(s)||!Array.isArray(s.uncertain)||new Set(s.uncertain).size!==s.uncertain.length||!s.uncertain.every(id=>byId.has(id)))throw new Error('이 문제집의 올바른 진행 기록 JSON 파일이 아닙니다.');
    const incoming={version,order:[...s.order],position:s.position,answers:{...s.answers},uncertain:[...s.uncertain]};
    if(!confirm(`풀이 ${Object.keys(incoming.answers).length}/150문제, 현재 위치 ${incoming.position+1}번, 헷갈림 ${incoming.uncertain.length}문제의 기록을 불러올까요?\n현재 기록을 교체합니다. 보관하려면 취소 후 먼저 내보내기 하세요.`)){
      transferMessage('불러오기를 취소했습니다. 현재 기록을 유지합니다.');return;
    }
    state=incoming;save();showReview(Object.keys(state.answers).length===questions.length);render();$('stem').focus();
    transferMessage(canSave?'진행 기록을 불러왔습니다. 이어서 풀 수 있습니다.':'진행 기록을 불러왔습니다. 브라우저 저장이 불가능하므로 종료 전에 다시 내보내기 해 주세요.');
  } catch(error) {transferMessage('불러오지 못했습니다. 현재 기록은 유지됩니다. '+(error instanceof SyntaxError?'JSON 파일 형식을 확인해 주세요.':error.message));}
  finally {$('import-file').value='';$('import-progress').disabled=false;}
});
$('export-log').addEventListener('click',()=>{
  const rows=reviewRows(), now=new Date();
  const header=`손해보험중개사 복습 로그\n저장 시각: ${now.toLocaleString('ko-KR')}\n${$('score').textContent}\n${$('review-count').textContent}\n`;
  const content=rows.map(row=>{
    const q=row.q;
    return `풀이 ${row.index+1}번 · 제${q.round}회 ${q.number}번 [${reviewStatus(row)}]\n${q.stem}\n${q.conditions?q.conditions+'\n':''}${q.options.map((v,i)=>symbols[i]+' '+v).join('\n')}\n`+
      (row.chosen===undefined?'아직 답하지 않은 문제입니다.\n':`내 답 ${symbols[row.chosen]} / 정답 ${symbols[q.answer]}\n해설: ${q.explanation}\n`)+
      `출처: 문제지 ${q.questionPage}쪽 · 해설지 ${q.explanationPage}쪽`;
  }).join('\n\n────────────────────\n\n');
  const url=URL.createObjectURL(new Blob(['\uFEFF',header+'\n'+(content||'복습 대상 문제가 없습니다.')],{type:'text/plain;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download=`손해보험중개사_복습로그_${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${now.getTime()}.txt`;
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
});
$('restart').addEventListener('click',()=>{
  if(!confirm('현재 풀이 기록과 복습 로그(오답·헷갈림)를 지우고 150문제를 새로 섞을까요? 보관하려면 취소 후 복습 로그를 파일로 저장하세요.'))return;
  state=freshState();showReview(false);if(canSave)$('storage-warning').hidden=true;save();render();$('stem').focus();
});
showReview(wasComplete);save();render();
</script>
</body>
</html>
